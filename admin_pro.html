<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADHAKU Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --navy-900: #102a43;
            --navy-800: #243b53;
            --navy-700: #334e68;
            --navy-600: #486581;
            --navy-500: #627d98;
            --navy-400: #829ab1;
            --navy-300: #9fb3c8;
            --navy-200: #bcccdc;
            --navy-100: #d9e2ec;
            --navy-50: #f0f4f8;
            --gold-500: #f59e0b;
            --gold-600: #d97706;
            --gold-100: #fef3c7;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --red-500: #ef4444;
            --red-100: #fee2e2;
            --green-500: #10b981;
            --green-100: #d1fae5;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--gray-50);
            color: var(--navy-900);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
        }

        input, select, textarea {
            font-family: inherit;
            outline: none;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
            padding: 1rem;
        }

        .login-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-xl);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo h1 {
            font-size: 2rem;
            color: var(--navy-900);
        }

        .login-logo span {
            color: var(--gold-500);
        }

        .login-logo p {
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--navy-700);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--navy-200);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--navy-500);
            box-shadow: 0 0 0 3px rgba(51,78,104,0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--navy-800);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--navy-900);
        }

        .btn-gold {
            background: var(--gold-500);
            color: var(--white);
        }

        .btn-gold:hover {
            background: var(--gold-600);
        }

        .btn-danger {
            background: var(--red-500);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: var(--white);
            color: var(--navy-700);
            border: 1px solid var(--navy-200);
        }

        .btn-outline:hover {
            background: var(--navy-50);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Admin Layout */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--navy-900);
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--navy-700);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            color: var(--gold-500);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--navy-300);
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .sidebar-link:hover {
            background: var(--navy-800);
            color: var(--white);
        }

        .sidebar-link.active {
            background: var(--navy-800);
            color: var(--gold-500);
            border-left: 3px solid var(--gold-500);
        }

        .sidebar-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--navy-700);
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 2rem;
        }

        /* Top Bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .topbar h1 {
            font-size: 1.75rem;
        }

        .hamburger {
            display: none;
            background: var(--navy-800);
            color: var(--white);
            padding: 0.5rem;
            border-radius: var(--radius-md);
            font-size: 1.25rem;
        }

        /* Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--gray-500);
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--navy-900);
        }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            background: var(--navy-50);
            color: var(--navy-700);
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.875rem;
        }

        tr:hover {
            background: var(--gray-50);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-published {
            background: var(--green-100);
            color: var(--green-500);
        }

        .badge-draft {
            background: var(--gray-100);
            color: var(--gray-500);
        }

        .badge-admin {
            background: var(--gold-100);
            color: var(--gold-600);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--navy-900);
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            z-index: 300;
            animation: slideUp 0.3s;
        }

        .toast-success {
            background: var(--green-500);
        }

        .toast-error {
            background: var(--red-500);
        }

        .hidden {
            display: none !important;
        }

        /* Loading */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--navy-200);
            border-top-color: var(--navy-800);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
            
            .hamburger {
                display: block;
            }
            
            .topbar h1 {
                font-size: 1.25rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .modal {
                padding: 1.5rem;
                margin: 0.5rem;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
        }

        .sidebar-overlay.open {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <h1>PADHAKU<span>.</span></h1>
                <p>Admin Panel</p>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password">
                </div>
                <div id="loginError" class="hidden" style="color: var(--red-500); margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button class="btn btn-gold btn-block" onclick="handleLogin()" id="loginBtn">
                    Login
                </button>
            </div>
            <div id="loginLoading" class="hidden" style="text-align: center; padding: 2rem;">
                <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px;"></div>
                <p style="margin-top: 1rem; color: var(--gray-500);">Authenticating...</p>
            </div>
        </div>
    </div>

    <!-- Admin Layout -->
    <div id="adminLayout" class="admin-layout hidden">
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>PADHAKU Admin</h2>
                <p style="font-size: 0.8rem; color: var(--navy-300);">Content Management</p>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-link active" data-page="dashboard" onclick="switchPage('dashboard')">📊 Dashboard</div>
                <div class="sidebar-link" data-page="materials" onclick="switchPage('materials')">📚 Study Materials</div>
                <div class="sidebar-link" data-page="classes" onclick="switchPage('classes')">🏫 Classes</div>
                <div class="sidebar-link" data-page="subjects" onclick="switchPage('subjects')">📖 Subjects</div>
                <div class="sidebar-link" data-page="videos" onclick="switchPage('videos')">🎬 Videos</div>
                <div class="sidebar-link" data-page="news" onclick="switchPage('news')">📰 News</div>
                <div class="sidebar-link" data-page="current-affairs" onclick="switchPage('current-affairs')">🌍 Current Affairs</div>
                <div class="sidebar-link" data-page="tests" onclick="switchPage('tests')">✍️ Tests & Quizzes</div>
                <div class="sidebar-link" data-page="roadmaps" onclick="switchPage('roadmaps')">🗺️ Roadmaps</div>
                <div class="sidebar-link" data-page="students" onclick="switchPage('students')">👨🎓 Students</div>
                <div class="sidebar-link" data-page="settings" onclick="switchPage('settings')">⚙️ Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="adminName" style="font-weight: 600; color: var(--navy-700);"></span>
                </div>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script>
        // ==================== SUPABASE CONFIGURATION ====================
        const SUPABASE_URL = 'https://ozrvpbziwpkfkejafjnm.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aeCYoS9jRAAqPHIGa6Uz6Q_XY_7l7Lj';

        // Keep the client variable available to every existing Admin Panel function.
        // Do not let a CDN/init error stop the rest of this script from defining handleLogin().
        let supabaseClient = null;

        function initializeSupabase() {
            try {
                if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                    throw new Error('Supabase library failed to load.');
                }

                supabaseClient = window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_PUBLISHABLE_KEY,
                    {
                        auth: {
                            autoRefreshToken: true,
                            persistSession: true,
                            detectSessionInUrl: true
                        }
                    }
                );

                return true;
            } catch (error) {
                console.error('Supabase initialization failed:', error);
                supabaseClient = null;
                return false;
            }
        }

        initializeSupabase();

        // ==================== STATE ====================
        let currentPage = 'dashboard';
        let currentUser = null;
        let currentProfile = null;

        // ==================== AUTH FUNCTIONS ====================
        
        async function checkSession() {
            if (!supabaseClient) {
                showLoginError('Authentication service could not be loaded. Please refresh the page.');
                return;
            }

            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (session) {
                    await verifyAdmin(session.user);
                }
            } catch (error) {
                console.error('Session check failed:', error);
                showLoginError(error.message || 'Unable to check your session. Please refresh the page.');
            }
        }

        async function verifyAdmin(user) {
            if (!supabaseClient) {
                showLoginError('Authentication service is not available. Please refresh the page.');
                return false;
            }

            try {
                const { data: profile, error } = await supabaseClient
                    .from('profile') // FIXED: changed 'profile' to 'profile'
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (error) throw error;

                if (profile && profile.role === 'admin') {
                    currentUser = user;
                    currentProfile = profile;
                    showAdminPanel();
                    return true;
                } else {
                    await supabaseClient.auth.signOut();
                    showLoginError('Access denied. Admin account required.');
                    return false;
                }
            } catch (error) {
                console.error('Error verifying admin:', error);
                await supabaseClient.auth.signOut();
                showLoginError(error.message || 'Unable to verify admin account.');
                return false;
            }
        }

        async function handleLogin() {
            const errorEl = document.getElementById('loginError');
            errorEl.classList.add('hidden');
            errorEl.textContent = '';

            if (!supabaseClient) {
                showLoginError('Authentication service could not be loaded. Please refresh the page.');
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showLoginError('Please enter email and password');
                return;
            }

            showLoginLoading(true);

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    await verifyAdmin(data.user);
                }
            } catch (error) {
                showLoginError(error.message || 'Login failed');
            } finally {
                showLoginLoading(false);
            }
        }

        async function handleLogout() {
            try {
                await supabaseClient.auth.signOut();
                currentUser = null;
                currentProfile = null;
                showLoginScreen();
                showToast('Logged out successfully', 'success');
            } catch (error) {
                showToast('Error logging out', 'error');
            }
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminLayout').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginLoading').classList.add('hidden');
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminLayout').classList.remove('hidden');
            document.getElementById('adminName').textContent = currentProfile?.full_name || currentUser?.email || 'Admin';
            switchPage('dashboard');
        }

        function showLoginError(message) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showLoginLoading(show) {
            document.getElementById('loginForm').classList.toggle('hidden', show);
            document.getElementById('loginLoading').classList.toggle('hidden', !show);
            document.getElementById('loginBtn').disabled = show;
        }

        // ==================== SIDEBAR ====================
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        function switchPage(page) {
            currentPage = page;
            
            // Update sidebar
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) {
                    link.classList.add('active');
                }
            });
            
            // Update title
            const titles = {
                'dashboard': 'Dashboard',
                'materials': 'Study Materials',
                'classes': 'Classes',
                'subjects': 'Subjects',
                'videos': 'Videos',
                'news': 'News',
                'current-affairs': 'Current Affairs',
                'tests': 'Tests & Quizzes',
                'roadmaps': 'Roadmaps',
                'students': 'Students',
                'settings': 'Settings'
            };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
            
            // Render page
            const content = document.getElementById('pageContent');
            switch(page) {
                case 'dashboard':
                    renderDashboard(content);
                    break;
                case 'materials':
                    renderMaterials(content);
                    break;
                case 'classes':
                    renderClasses(content);
                    break;
                case 'subjects':
                    renderSubjects(content);
                    break;
                case 'videos':
                    renderVideos(content);
                    break;
                case 'news':
                    renderNews(content);
                    break;
                case 'current-affairs':
                    renderCurrentAffairs(content);
                    break;
                case 'tests':
                    renderTests(content);
                    break;
                case 'roadmaps':
                    renderRoadmaps(content);
                    break;
                case 'students':
                    renderStudents(content);
                    break;
                case 'settings':
                    renderSettings(content);
                    break;
            }
        }

        // ==================== DASHBOARD ====================
        
        async function renderDashboard(container) {
            container.innerHTML = '<div style="text-align: center; padding: 3rem;"><div class="loading-spinner"></div></div>';
            
            try {
                const [studentsResult, materialsResult, videosResult, newsResult, caResult, testsResult] = await Promise.all([
                    supabaseClient.from('profile').select('*', { count: 'exact', head: true }), // FIXED: 'profile' to 'profile', added head: true
                    supabaseClient.from('materials').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('videos').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('news').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('current_affairs').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('tests').select('*', { count: 'exact', head: true })
                ]);

                const totalStudents = studentsResult.count || 0;
                const totalMaterials = materialsResult.count || 0;
                const totalVideos = videosResult.count || 0;
                const totalNews = newsResult.count || 0;
                const totalCA = caResult.count || 0;
                const totalTests = testsResult.count || 0;

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total Students</h3>
                            <div class="stat-value">${totalStudents}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Study Materials</h3>
                            <div class="stat-value">${totalMaterials}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Videos</h3>
                            <div class="stat-value">${totalVideos}</div>
                        </div>
                        <div class="stat-card">
                            <h3>News</h3>
                            <div class="stat-value">${totalNews}</div>
                        </div>
                        <div class="stat-card">

        async function saveMaterial(materialId) {
            const materialData = {
                title: document.getElementById('matTitle').value,
                description: document.getElementById('matDescription').value,
                class: document.getElementById('matClass').value,
                subject: document.getElementById('matSubject').value,
                chapter: document.getElementById('matChapter').value,
                type: document.getElementById('matType').value,
                thumbnail_url: document.getElementById('matThumbnail').value,
                resource_url: document.getElementById('matResourceUrl').value,
                youtube_url: document.getElementById('matYoutubeUrl').value,
                published: document.getElementById('matPublished').checked
            };

            if (!materialData.title || !materialData.type) {
                showToast('Please fill in required fields', 'error');
                return;
            }

            try {
                let result;
                if (materialId) {
                    result = await supabaseClient
                        .from('materials')
                        .update(materialData)
                        .eq('id', materialId);
                } else {
                    result = await supabaseClient
                        .from('materials')
                        .insert(materialData);
                }

                if (result.error) throw result.error;
                
                document.querySelector('.modal-overlay').remove();
                showToast('Material saved successfully', 'success');
                switchPage('materials');
            } catch (error) {
                console.error('Error saving material:', error);
                showToast('Error saving material: ' + error.message, 'error');
            }
        }

        function filterTable(tableId, query) {
            const table = document.getElementById(tableId);
            const rows = table.getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].textContent.toLowerCase();
                rows[i].style.display = rowText.includes(query.toLowerCase()) ? '' : 'none';
            }
        }

        function filterMaterialsByType(type) {
            const table = document.getElementById('materialsTable');
            const rows = table.getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                const typeCell = rows[i].getElementsByTagName('td')[3];
                if (typeCell) {
                    const typeText = typeCell.textContent;
                    rows[i].style.display = (type === 'all' || typeText.includes(type)) ? '' : 'none';
                }
            }
        }

        async function saveTest(testId) {
            const title = document.getElementById('testTitle').value;
            if (!title) {
                showToast('Please enter test title', 'error');
                return;
            }
            
            const testData = {
                title: title,
                class: document.getElementById('testClass').value,
                subject: document.getElementById('testSubject').value,
                duration: parseInt(document.getElementById('testDuration').value) || 30,
                description: document.getElementById('testDescription').value,
                published: document.getElementById('testPublished').checked
            };
            
            try {
                let testResult;
                if (testId) {
                    testResult = await supabaseClient.from('tests').update(testData).eq('id', testId);
                } else {
                    testResult = await supabaseClient.from('tests').insert(testData).select();
                }
                
                if (testResult.error) throw testResult.error;
                
                const savedTestId = testId || testResult.data[0].id;
                
                // Delete existing questions if editing
                if (testId) {
                    await supabaseClient.from('test_questions').delete().eq('test_id', testId);
                }
                
                // Save questions
                const questionDivs = document.querySelectorAll('.test-question');
                const questions = [];
                
                questionDivs.forEach((div, index) => {
                    const questionText = div.querySelector('.question-text').value;
                    if (questionText) {
                        questions.push({
                            test_id: savedTestId,
                            question: questionText,
                            option_a: div.querySelector('.option-a').value,
                            option_b: div.querySelector('.option-b').value,
                            option_c: div.querySelector('.option-c').value,
                            option_d: div.querySelector('.option-d').value,
                            correct_answer: div.querySelector('.correct-answer').value,
                            explanation: div.querySelector('.explanation').value,
                            question_order: index
                        });
                    }
                });
                
                if (questions.length > 0) {
                    const { error: qError } = await supabaseClient.from('test_questions').insert(questions);
                    if (qError) throw qError;
                }
                
                document.querySelector('.modal-overlay').remove();
                showToast('Test saved successfully', 'success');
                switchPage('tests');
            } catch (error) {
                console.error('Error saving test:', error);
                showToast('Error saving test: ' + error.message, 'error');
            }
        }

                    <strong>Step ${stepsList.children.length + 1}</strong>

        }

        async function saveRoadmap(roadmapId) {
            const examName = document.getElementById('rmExamName').value;
            if (!examName) {
                showToast('Please enter exam name', 'error');
                return;
            }
            
            const roadmapData = {
                exam_name: examName,
                duration: document.getElementById('rmDuration').value,
                difficulty: document.getElementById('rmDifficulty').value,
                description: document.getElementById('rmDescription').value,
                published: document.getElementById('rmPublished').checked
            };
            
            try {
                let roadmapResult;
                if (roadmapId) {
                    roadmapResult = await supabaseClient.from('roadmaps').update(roadmapData).eq('id', roadmapId);
                } else {
                    roadmapResult = await supabaseClient.from('roadmaps').insert(roadmapData).select();
                }
                
                if (roadmapResult.error) throw roadmapResult.error;
                
                const savedRoadmapId = roadmapId || roadmapResult.data[0].id;
                
                if (roadmapId) {
                    await supabaseClient.from('roadmap_steps').delete().eq('roadmap_id', roadmapId);
                }
                
                const stepDivs = document.querySelectorAll('#stepsList > div');
                const steps = [];
                
                stepDivs.forEach((div, index) => {
                    const month = div.querySelector('.step-month').value;
                    const title = div.querySelector('.step-title').value;
                    if (month || title) {
                        steps.push({
                            roadmap_id: savedRoadmapId,
                            month: month,
                            title: title,
                            subjects: div.querySelector('.step-subjects').value.split(',').map(s => s.trim()).filter(s => s),
                            topics: div.querySelector('.step-topics').value.split(',').map(s => s.trim()).filter(s => s),
                            step_order: index
                        });
                    }
                });
                
                if (steps.length > 0) {
                    const { error: sError } = await supabaseClient.from('roadmap_steps').insert(steps);
                    if (sError) throw sError;
                }
                
                document.querySelector('.modal-overlay').remove();
                showToast('Roadmap saved successfully', 'success');
                switchPage('roadmaps');
            } catch (error) {
                console.error('Error saving roadmap:', error);
                showToast('Error saving roadmap: ' + error.message, 'error');
            }
        }

        async function deleteRoadmap(roadmapId) {
            if (!confirm('Are you sure you want to delete this roadmap?')) return;
            
            try {
                const { error } = await supabaseClient.from('roadmaps').delete().eq('id', roadmapId);
                if (error) throw error;
                showToast('Roadmap deleted successfully', 'success');
                switchPage('roadmaps');
            } catch (error) {
                console.error('Error deleting roadmap:', error);
                showToast('Error deleting roadmap', 'error');
            }
        }

        }

        // ==================== SETTINGS ====================
        
        const defaultSiteSettings = {

            accent_color: '#f59e0b',
            background_color: '#ffffff',
            text_color: '#102a43',
            hero_title: 'Learn Today.\nPrepare for Tomorrow.',
            hero_subtitle: 'Study materials, video lectures, notes, practice questions, current affairs and preparation roadmaps—all in one place.',
            hero_button_1: '📚 Explore Classes',
            hero_button_2: '🎯 Competitive Exams',

            materials_title: 'Latest Study Materials',

        function renderSettings(container) {

                <div class="card">

            loadSiteSettingsForAdmin().then(settings => {

                    <h3 style="margin-bottom:1rem;">Colors</h3>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;">
                        ${['primary_color','secondary_color','accent_color','background_color','text_color'].map((key) => `
                            <div class="form-group">
                                <label>${key.replaceAll('_',' ').replace(/\b\w/g, c => c.toUpperCase())}</label>
                                <input type="color" class="form-input" id="set_${key}" value="${settings[key]}" style="height:48px;padding:0.25rem;">
                            </div>`).join('')}
                    </div>
                    <h3 style="margin:1.5rem 0 1rem;">Homepage Content</h3>
                    <div class="form-group">
                        <label>Hero Title</label>
                        <textarea class="form-input" id="set_hero_title" rows="2"></textarea>
                    </div>
                    <div class="form-group">

                        <textarea class="form-input" id="set_hero_subtitle" rows="3"></textarea>

                        <div class="form-group"><label>Hero Button 1</label><input class="form-input" id="set_hero_button_1"></div>
                        <div class="form-group"><label>Hero Button 2</label><input class="form-input" id="set_hero_button_2"></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group"><label>Quick Access Heading</label><input class="form-input" id="set_quick_access_title"></div>
                        <div class="form-group"><label>Materials Heading</label><input class="form-input" id="set_materials_title"></div>
                        <div class="form-group"><label>Roadmaps Heading</label><input class="form-input" id="set_roadmaps_title"></div>
                        <div class="form-group"><label>News Heading</label><input class="form-input" id="set_news_title"></div>
                    </div>
                    <button class="btn btn-gold" onclick="saveSiteSettings()">Save Website Settings</button>
                `;
                Object.keys(defaultSiteSettings).forEach(key => {
                    const el = document.getElementById('set_' + key);

            });
        }

        async function saveSiteSettings() {
            const settings = {};
            Object.keys(defaultSiteSettings).forEach(key => {
                const el = document.getElementById('set_' + key);
                if (el) settings[key] = el.value;
            });
            try {
                const { error } = await supabaseClient
                    .from('site_settings')
                    .upsert({ id: 1, settings: settings, updated_at: new Date().toISOString() });
                if (error) throw error;
                showToast('Website settings saved successfully', 'success');
            } catch (error) {
                console.error('Error saving site settings:', error);
                showToast('Error saving website settings: ' + error.message, 'error');
            }
        }

        // ==================== TOAST ====================
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'success') {
                toast.classList.add('toast-success');
            } else if (type === 'error') {
                toast.classList.add('toast-error');
            }
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // ==================== INITIALIZATION ====================
        
        checkSession();
    </script>

<script>
/* ============================================================
   PADHAKU PRO ADMIN ENHANCEMENTS
   - Uses existing Supabase tables
   - Stores editable academic structure in site_settings.settings
   - Adds safer YouTube handling and direct-download field
   - Adds image support for current affairs (after SQL migration)
   - Adds roadmap diagram URL
   ============================================================ */

(function () {
    const PRO_DEFAULT_STRUCTURE = {
        classes: Array.from({length: 12}, (_, i) => ({
            id: i + 1,
            name: `Class ${i + 1}`,
            subjects: []
        })),
        streams: [
            { name: 'Science', subjects: ['Physics', 'Chemistry', 'Mathematics', 'Biology', 'English'] },
            { name: 'Commerce', subjects: ['Accountancy', 'Business Studies', 'Economics', 'Mathematics', 'English'] },
            { name: 'Humanities / Arts', subjects: ['History', 'Political Science', 'Geography', 'Economics', 'Sociology', 'Psychology', 'English'] }
        ]
    };

    const esc = (value) => String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    async function proGetSettings() {
        const { data, error } = await supabaseClient
            .from('site_settings')
            .select('settings')
            .eq('id', 1)
            .maybeSingle();
        if (error) throw error;
        return {
            ...(typeof defaultSiteSettings === 'object' ? defaultSiteSettings : {}),
            ...(data?.settings || {})
        };
    }

    async function proSaveSettings(patch) {
        const current = await proGetSettings();
        const next = { ...current, ...patch };
        const { error } = await supabaseClient
            .from('site_settings')
            .upsert({ id: 1, settings: next, updated_at: new Date().toISOString() });
        if (error) throw error;
        return next;
    }

    async function proGetStructure() {
        const settings = await proGetSettings();
        return settings.academic_structure || JSON.parse(JSON.stringify(PRO_DEFAULT_STRUCTURE));
    }

    function proSubjectList(structure) {
        const all = [];
        (structure.classes || []).forEach(c => (c.subjects || []).forEach(s => {
            if (!all.includes(s.name || s)) all.push(s.name || s);
        }));
        (structure.streams || []).forEach(s => (s.subjects || []).forEach(sub => {
            if (!all.includes(sub.name || sub)) all.push(sub.name || sub);
        }));
        return all;
    }

    function proSubjectsForClass(structure, className) {
        const c = (structure.classes || []).find(x => x.name === className);
        return c?.subjects || [];
    }

    async function proSaveStructure(structure) {
        await proSaveSettings({ academic_structure: structure });
        showToast('Academic structure saved successfully', 'success');
    }

    window.renderClasses = async function (container) {
        container.innerHTML = '<div class="card"><p>Loading classes...</p></div>';
        try {
            const structure = await proGetStructure();
            const classes = structure.classes || [];
            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Classes & Chapters</h2>
                            <p style="color:var(--gray-500);margin-top:.35rem;">Edit class names, subjects and chapter lists without touching code.</p>
                        </div>
                        <button class="btn btn-gold" onclick="proAddClass()">+ Add Class</button>
                    </div>
                    <div id="proClassesList">
                        ${classes.map((c, ci) => `
                            <div class="card" style="margin-bottom:1rem;border:1px solid var(--navy-100);">
                                <div style="display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap;">
                                    <input class="form-input" style="max-width:280px;" value="${esc(c.name)}"
                                           onchange="proUpdateClassName(${ci}, this.value)">
                                    <div style="display:flex;gap:.5rem;">
                                        <button class="btn btn-primary btn-sm" onclick="proAddSubject(${ci})">+ Subject</button>
                                        <button class="btn btn-danger btn-sm" onclick="proDeleteClass(${ci})">Delete Class</button>
                                    </div>
                                </div>
                                <div style="margin-top:1rem;">
                                    ${(c.subjects || []).length ? (c.subjects || []).map((s, si) => {
                                        const subject = typeof s === 'string' ? {name:s, chapters:[]} : s;
                                        return `
                                        <div style="padding:1rem;border:1px solid var(--navy-100);border-radius:12px;margin:.75rem 0;">
                                            <div style="display:flex;gap:.5rem;align-items:center;">
                                                <input class="form-input" value="${esc(subject.name)}"
                                                       onchange="proUpdateSubject(${ci},${si},this.value)">
                                                <button class="btn btn-danger btn-sm" onclick="proDeleteSubject(${ci},${si})">Remove</button>
                                            </div>
                                            <label style="display:block;margin-top:.75rem;font-weight:600;">Chapters (one per line)</label>
                                            <textarea class="form-input" rows="4"
                                                onchange="proUpdateChapters(${ci},${si},this.value)">${esc((subject.chapters || []).join('\n'))}</textarea>
                                        </div>`;
                                    }).join('') : '<p style="color:var(--gray-500);">No subjects yet. Add one above.</p>'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-gold" onclick="proSaveAcademicStructure()">Save All Classes</button>
                </div>
            `;
            window._proStructure = structure;
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="card"><p style="color:var(--red-500);">Unable to load academic structure: ${esc(e.message)}</p></div>`;
        }
    };

    window.proUpdateClassName = (ci, value) => { window._proStructure.classes[ci].name = value.trim(); };
    window.proUpdateSubject = (ci, si, value) => {
        const s = window._proStructure.classes[ci].subjects[si];
        window._proStructure.classes[ci].subjects[si] = typeof s === 'string' ? {name:value.trim(), chapters:[]} : {...s, name:value.trim()};
    };
    window.proUpdateChapters = (ci, si, value) => {
        const s = window._proStructure.classes[ci].subjects[si];
        const obj = typeof s === 'string' ? {name:s, chapters:[]} : s;
        obj.chapters = value.split('\n').map(x => x.trim()).filter(Boolean);
        window._proStructure.classes[ci].subjects[si] = obj;
    };
    window.proAddClass = () => {
        window._proStructure.classes.push({id: Date.now(), name:`New Class`, subjects:[]});
        renderClasses(document.getElementById('mainContent'));
    };
    window.proDeleteClass = (ci) => {
        if (!confirm('Delete this class from the website structure?')) return;
        window._proStructure.classes.splice(ci, 1);
        renderClasses(document.getElementById('mainContent'));
    };
    window.proAddSubject = (ci) => {
        window._proStructure.classes[ci].subjects.push({name:'New Subject', chapters:[]});
        renderClasses(document.getElementById('mainContent'));
    };
    window.proDeleteSubject = (ci, si) => {
        window._proStructure.classes[ci].subjects.splice(si,1);
        renderClasses(document.getElementById('mainContent'));
    };
    window.proSaveAcademicStructure = async () => {
        try { await proSaveStructure(window._proStructure); }
        catch(e){ showToast('Save failed: '+e.message,'error'); }
    };

    window.renderSubjects = async function (container) {
        container.innerHTML = '<div class="card"><p>Loading subjects...</p></div>';
        try {
            const structure = await proGetStructure();
            const subjects = proSubjectList(structure);
            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Subjects</h2>
                            <p style="color:var(--gray-500);margin-top:.35rem;">Subjects are connected to classes above. Manage subject names and chapters there.</p>
                        </div>
                        <button class="btn btn-gold" onclick="proAddGlobalSubject()">+ Add Subject to Class</button>
                    </div>
                    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
                        ${subjects.map(s => `<span class="badge">${esc(s)}</span>`).join('') || '<p>No subjects configured.</p>'}
                    </div>
                </div>
            `;
            window._proStructure = structure;
        } catch(e) {
            container.innerHTML = `<div class="card"><p style="color:var(--red-500);">${esc(e.message)}</p></div>`;
        }
    };

    window.proAddGlobalSubject = async () => {
        try {
            const structure = await proGetStructure();
            if (!structure.classes?.length) return showToast('Create a class first.','error');
            const ci = 0;
            structure.classes[ci].subjects = structure.classes[ci].subjects || [];
            structure.classes[ci].subjects.push({name:'New Subject',chapters:[]});
            await proSaveStructure(structure);
            switchPage('classes');
        } catch(e) { showToast('Unable to add subject: '+e.message,'error'); }
    };

    /* ---------- Materials: richer YouTube + direct download ---------- */
    window.getMaterialFormHTML = function(material = null) {
        const classOptions = Array.from({length: 12}, (_, i) => `Class ${i+1}`)
            .map(c => `<option value="${esc(c)}" ${material?.class === c ? 'selected':''}>${esc(c)}</option>`).join('');
        return `
            <div class="form-group"><label>Title *</label><input type="text" class="form-input" id="matTitle" value="${esc(material?.title)}" required></div>
            <div class="form-group"><label>Description</label><textarea class="form-input" id="matDescription" rows="3">${esc(material?.description)}</textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group"><label>Class</label><select class="form-input" id="matClass"><option value="">Select Class</option>${classOptions}</select></div>
                <div class="form-group"><label>Subject</label><input class="form-input" id="matSubject" value="${esc(material?.subject)}"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group"><label>Chapter</label><input class="form-input" id="matChapter" value="${esc(material?.chapter)}"></div>
                <div class="form-group"><label>Type *</label><select class="form-input" id="matType">
                    ${['Notes','PDF','DPP','Video','PYQ','MCQ','Test'].map(t=>`<option ${material?.type===t?'selected':''}>${t}</option>`).join('')}
                </select></div>
            </div>
            <div class="form-group"><label>Thumbnail URL</label><input type="url" class="form-input" id="matThumbnail" value="${esc(material?.thumbnail_url)}" placeholder="https://..."></div>
            <div class="form-group"><label>YouTube URL</label><input type="url" class="form-input" id="matYoutubeUrl" value="${esc(material?.youtube_url)}" placeholder="https://www.youtube.com/watch?v=..."></div>
            <div class="form-group"><label>Direct Download URL <span style="font-weight:400;color:var(--gray-500);">(optional)</span></label>
                <input type="url" class="form-input" id="matDownloadUrl" value="${esc(material?.download_url || '')}" placeholder="Direct MP4/PDF/file URL">
                <small style="color:var(--gray-500);">YouTube videos themselves cannot be made downloadable through an iframe. Use a direct file URL for your own downloadable copy.</small>
            </div>
            <div class="form-group"><label>Resource URL <span style="font-weight:400;color:var(--gray-500);">(optional)</span></label>
                <input type="url" class="form-input" id="matResourceUrl" value="${esc(material?.resource_url)}"></div>
            <div class="form-group"><label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" id="matPublished" ${material?.published?'checked':''}> Published</label></div>
        `;
    };

    window.saveMaterial = async function(materialId) {
        const materialData = {
            title: document.getElementById('matTitle').value.trim(),
            description: document.getElementById('matDescription').value.trim(),
            class: document.getElementById('matClass').value,
            subject: document.getElementById('matSubject').value.trim(),
            chapter: document.getElementById('matChapter').value.trim(),
            type: document.getElementById('matType').value,
            thumbnail_url: document.getElementById('matThumbnail').value.trim(),
            resource_url: document.getElementById('matResourceUrl').value.trim(),
            youtube_url: document.getElementById('matYoutubeUrl').value.trim(),
            published: document.getElementById('matPublished').checked
        };
        if (!materialData.title) return showToast('Title is required','error');
        try {
            const payload = {...materialData};
            const downloadUrl = document.getElementById('matDownloadUrl')?.value.trim();
            // Save download_url only if the migrated column exists; otherwise the main save still works.
            let result = await supabaseClient.from('materials').update({...payload, download_url: downloadUrl || null}).eq('id', materialId);
            if (result.error && /download_url|column/i.test(result.error.message || '')) {
                result = materialId
                    ? await supabaseClient.from('materials').update(payload).eq('id', materialId)
                    : await supabaseClient.from('materials').insert(payload).select();
            } else if (!materialId) {
                result = await supabaseClient.from('materials').insert({...payload, download_url: downloadUrl || null}).select();
                if (result.error && /download_url|column/i.test(result.error.message || '')) {
                    result = await supabaseClient.from('materials').insert(payload).select();
                }
            }
            if (result.error) throw result.error;
            document.querySelector('.modal-overlay')?.remove();
            showToast('Material saved successfully','success');
            switchPage('materials');
        } catch(e) { console.error(e); showToast('Error saving material: '+e.message,'error'); }
    };

    /* ---------- Video manager: link, thumbnail, description, class/subject/chapter ---------- */
    window.getVideoFormHTML = function(video = null) {
        return `
            <div class="form-group"><label>Title *</label><input class="form-input" id="vidTitle" value="${esc(video?.title)}" required></div>
            <div class="form-group"><label>Description</label><textarea class="form-input" id="vidDescription" rows="3">${esc(video?.description)}</textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group"><label>Class</label><select class="form-input" id="vidClass"><option value="">Select Class</option>${Array.from({length:12},(_,i)=>`<option ${video?.class===`Class ${i+1}`?'selected':''}>Class ${i+1}</option>`).join('')}</select></div>
                <div class="form-group"><label>Subject</label><input class="form-input" id="vidSubject" value="${esc(video?.subject)}"></div>
            </div>
            <div class="form-group"><label>Chapter</label><input class="form-input" id="vidChapter" value="${esc(video?.chapter)}"></div>
            <div class="form-group"><label>YouTube URL *</label><input type="url" class="form-input" id="vidYoutubeUrl" value="${esc(video?.youtube_url)}" placeholder="https://www.youtube.com/watch?v=..." required></div>
            <div class="form-group"><label>Thumbnail URL</label><input type="url" class="form-input" id="vidThumbnail" value="${esc(video?.thumbnail_url)}"></div>
            <div class="form-group"><label>Direct Download URL (optional)</label><input type="url" class="form-input" id="vidDownloadUrl" value="${esc(video?.download_url || '')}"></div>
            <div class="form-group"><label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" id="vidPublished" ${video?.published?'checked':''}> Published</label></div>
        `;
    };

    window.saveVideo = async function(videoId) {
        const payload = {
            title: document.getElementById('vidTitle').value.trim(),
            description: document.getElementById('vidDescription').value.trim(),
            class: document.getElementById('vidClass').value,
            subject: document.getElementById('vidSubject').value.trim(),
            chapter: document.getElementById('vidChapter').value.trim(),
            youtube_url: document.getElementById('vidYoutubeUrl').value.trim(),
            thumbnail_url: document.getElementById('vidThumbnail').value.trim(),
            published: document.getElementById('vidPublished').checked
        };
        if (!payload.title || !payload.youtube_url) return showToast('Title and YouTube URL are required','error');
        try {
            const downloadUrl = document.getElementById('vidDownloadUrl')?.value.trim();
            let result;
            if (videoId) result = await supabaseClient.from('videos').update({...payload, download_url: downloadUrl || null}).eq('id',videoId);
            else result = await supabaseClient.from('videos').insert({...payload, download_url: downloadUrl || null}).select();
            if (result.error && /download_url|column/i.test(result.error.message || '')) {
                result = videoId ? await supabaseClient.from('videos').update(payload).eq('id',videoId)
                                  : await supabaseClient.from('videos').insert(payload).select();
            }
            if (result.error) throw result.error;
            document.querySelector('.modal-overlay')?.remove();
            showToast('Video saved successfully','success');
            switchPage('videos');
        } catch(e) { showToast('Error saving video: '+e.message,'error'); }
    };

    /* ---------- News with image + article content ---------- */
    window.getNewsFormHTML = function(news = null) {
        return `
            <div class="form-group"><label>Title *</label><input class="form-input" id="newsTitle" value="${esc(news?.title)}" required></div>
            <div class="form-group"><label>Content / Description</label><textarea class="form-input" id="newsDescription" rows="6">${esc(news?.description)}</textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group"><label>Category</label><select class="form-input" id="newsCategory">${['Board Exams','Exam Notifications','Admissions','Scholarships','Government Updates','College Admissions','General'].map(c=>`<option ${news?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>Published Date</label><input type="date" class="form-input" id="newsDate" value="${esc(news?.published_date || new Date().toISOString().slice(0,10))}"></div>
            </div>
            <div class="form-group"><label>Image URL</label><input type="url" class="form-input" id="newsImageUrl" value="${esc(news?.image_url)}" placeholder="https://..."></div>
            <div class="form-group"><label>Article / Source URL</label><input type="url" class="form-input" id="newsArticleUrl" value="${esc(news?.article_url)}"></div>
            <div class="form-group"><label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" id="newsPublished" ${news?.published?'checked':''}> Published</label></div>
        `;
    };

    window.saveNews = async function(newsId) {
        const payload = {
            title: document.getElementById('newsTitle').value.trim(),
            description: document.getElementById('newsDescription').value.trim(),
            category: document.getElementById('newsCategory').value,
            image_url: document.getElementById('newsImageUrl').value.trim(),
            article_url: document.getElementById('newsArticleUrl').value.trim(),
            published_date: document.getElementById('newsDate').value,
            published: document.getElementById('newsPublished').checked
        };
        if (!payload.title) return showToast('News title is required','error');
        try {
            const result = newsId
                ? await supabaseClient.from('news').update(payload).eq('id',newsId)
                : await supabaseClient.from('news').insert(payload).select();
            if (result.error) throw result.error;
            document.querySelector('.modal-overlay')?.remove();
            showToast('News saved successfully','success');
            switchPage('news');
        } catch(e) { showToast('Error saving news: '+e.message,'error'); }
    };

    /* ---------- Current Affairs with image URL ---------- */
    window.showCurrentAffairForm = function(affairId = null) {
        const modal = document.createElement('div');
        modal.className='modal-overlay';
        modal.innerHTML = `<div class="modal"><h2>${affairId?'Edit':'Add'} Current Affair</h2>
            <div id="caFormContent">${affairId?'<p>Loading...</p>':proCAFormHTML()}</div>
            <div style="display:flex;gap:.5rem;margin-top:1rem;"><button class="btn btn-primary" onclick="saveCurrentAffair('${affairId||''}')">Save</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>
        </div>`;
        document.getElementById('modalContainer').appendChild(modal);
        if (affairId) loadCurrentAffairForEdit(affairId);
    };
    function proCAFormHTML(a=null) {
        return `<div class="form-group"><label>Title *</label><input class="form-input" id="caTitle" value="${esc(a?.title)}"></div>
        <div class="form-group"><label>Content</label><textarea class="form-input" id="caDescription" rows="6">${esc(a?.description)}</textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div class="form-group"><label>Type</label><input class="form-input" id="caType" value="${esc(a?.type||'Daily')}"></div><div class="form-group"><label>Topic</label><input class="form-input" id="caTopic" value="${esc(a?.topic||'General')}"></div></div>
        <div class="form-group"><label>Date</label><input type="date" class="form-input" id="caDate" value="${esc(a?.date || new Date().toISOString().slice(0,10))}"></div>
        <div class="form-group"><label>Image URL (requires SQL migration)</label><input type="url" class="form-input" id="caImageUrl" value="${esc(a?.image_url||'')}"></div>
        <div class="form-group"><label>Resource URL</label><input type="url" class="form-input" id="caResourceUrl" value="${esc(a?.resource_url)}"></div>
        <div class="form-group"><label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" id="caPublished" ${a?.published?'checked':''}> Published</label></div>`;
    }
    window.loadCurrentAffairForEdit = async function(id) {
        try {
            const {data,error}=await supabaseClient.from('current_affairs').select('*').eq('id',id).single();
            if(error)throw error;
            document.getElementById('caFormContent').innerHTML=proCAFormHTML(data);
        } catch(e){showToast('Unable to load current affair: '+e.message,'error');}
    };
    window.saveCurrentAffair = async function(id) {
        const payload={title:document.getElementById('caTitle').value.trim(),description:document.getElementById('caDescription').value.trim(),type:document.getElementById('caType').value.trim(),topic:document.getElementById('caTopic').value.trim(),date:document.getElementById('caDate').value,resource_url:document.getElementById('caResourceUrl').value.trim(),published:document.getElementById('caPublished').checked};
        const image=document.getElementById('caImageUrl')?.value.trim();
        try{
            let result=id?await supabaseClient.from('current_affairs').update({...payload,image_url:image||null}).eq('id',id):await supabaseClient.from('current_affairs').insert({...payload,image_url:image||null}).select();
            if(result.error && /image_url|column/i.test(result.error.message||'')){
                result=id?await supabaseClient.from('current_affairs').update(payload).eq('id',id):await supabaseClient.from('current_affairs').insert(payload).select();
                if(image) showToast('Saved, but image_url column is missing. Run the SQL migration.','error');
            }
            if(result.error)throw result.error;
            document.querySelector('.modal-overlay')?.remove(); showToast('Current affair saved','success'); switchPage('current-affairs');
        }catch(e){showToast('Error saving current affair: '+e.message,'error');}
    };

    /* ---------- Roadmap diagram URL ---------- */
    window.showRoadmapForm = function(roadmapId=null) {
        const modal=document.createElement('div'); modal.className='modal-overlay';
        modal.innerHTML=`<div class="modal" style="max-width:800px;"><h2>${roadmapId?'Edit':'Add'} Roadmap</h2><div id="proRoadmapForm"><p>Loading...</p></div>
        <div style="display:flex;gap:.5rem;margin-top:1rem;"><button class="btn btn-primary" onclick="proSaveRoadmap('${roadmapId||''}')">Save</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div></div>`;
        document.getElementById('modalContainer').appendChild(modal);
        proLoadRoadmapForm(roadmapId);
    };
    async function proLoadRoadmapForm(id) {
        let r=null;
        if(id){const x=await supabaseClient.from('roadmaps').select('*').eq('id',id).single(); if(x.error) return showToast(x.error.message,'error'); r=x.data;}
        document.getElementById('proRoadmapForm').innerHTML=`
            <div class="form-group"><label>Exam / Roadmap Name *</label><input class="form-input" id="rmExamName" value="${esc(r?.exam_name)}"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div class="form-group"><label>Duration</label><input class="form-input" id="rmDuration" value="${esc(r?.duration)}"></div><div class="form-group"><label>Difficulty</label><select class="form-input" id="rmDifficulty">${['Easy','Medium','Hard','Very Hard'].map(x=>`<option ${r?.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
            <div class="form-group"><label>Description</label><textarea class="form-input" id="rmDescription" rows="4">${esc(r?.description)}</textarea></div>
            <div class="form-group"><label>Roadmap Diagram URL (requires SQL migration)</label><input class="form-input" id="rmDiagramUrl" value="${esc(r?.diagram_url||'')}" placeholder="https://.../roadmap.png"></div>
            <div class="form-group"><label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" id="rmPublished" ${r?.published?'checked':''}> Published</label></div>
            <h3>Steps</h3><div id="stepsList"></div><button class="btn btn-primary btn-sm" onclick="addStep()">+ Add Step</button>`;
        if(r){const q=await supabaseClient.from('roadmap_steps').select('*').eq('roadmap_id',id).order('step_order'); (q.data||[]).forEach(addStep);}
    }
    window.proSaveRoadmap = async function(id){
        const payload={exam_name:document.getElementById('rmExamName').value.trim(),duration:document.getElementById('rmDuration').value.trim(),difficulty:document.getElementById('rmDifficulty').value,description:document.getElementById('rmDescription').value.trim(),published:document.getElementById('rmPublished').checked};
        const diagram=document.getElementById('rmDiagramUrl')?.value.trim();
        if(!payload.exam_name)return showToast('Roadmap name is required','error');
        try{
            let result=id?await supabaseClient.from('roadmaps').update({...payload,diagram_url:diagram||null}).eq('id',id):await supabaseClient.from('roadmaps').insert({...payload,diagram_url:diagram||null}).select();
            if(result.error&&/diagram_url|column/i.test(result.error.message||'')) result=id?await supabaseClient.from('roadmaps').update(payload).eq('id',id):await supabaseClient.from('roadmaps').insert(payload).select();
            if(result.error)throw result.error;
            const saved=id||result.data[0].id;
            if(id)await supabaseClient.from('roadmap_steps').delete().eq('roadmap_id',id);
            const rows=[...document.querySelectorAll('#stepsList > div')].map((div,i)=>({
                roadmap_id:saved,month:div.querySelector('.step-month')?.value||'',title:div.querySelector('.step-title')?.value||'',
                subjects:(div.querySelector('.step-subjects')?.value||'').split(',').map(x=>x.trim()).filter(Boolean),
                topics:(div.querySelector('.step-topics')?.value||'').split(',').map(x=>x.trim()).filter(Boolean),step_order:i
            })).filter(x=>x.month||x.title);
            if(rows.length){const q=await supabaseClient.from('roadmap_steps').insert(rows);if(q.error)throw q.error;}
            document.querySelector('.modal-overlay')?.remove();showToast('Roadmap saved','success');switchPage('roadmaps');
        }catch(e){showToast('Error saving roadmap: '+e.message,'error');}
    };

    /* ---------- Students: robust profile list, optional verified flag ---------- */
    window.renderStudents = async function(container) {
        container.innerHTML='<div class="card"><p>Loading students...</p></div>';
        try{
            const {data,error}=await supabaseClient.from('profile').select('*');
            if(error)throw error;
            const students=(data||[]).filter(s=>String(s.role||'student').toLowerCase()!=='admin');
            const verifiedCount=students.filter(s=>s.verified===true||s.is_verified===true||s.phone_verified===true).length;
            container.innerHTML=`
                <div class="card">
                    <div class="card-header"><div><h2 class="card-title">Students (${students.length})</h2><p style="color:var(--gray-500);">Verified: ${verifiedCount} • Profile records are shown below.</p></div></div>
                    <input class="form-input" placeholder="Search by name, mobile, email..." oninput="filterTable('studentsTable',this.value)" style="margin-bottom:1rem;">
                    <div class="table-container"><table id="studentsTable"><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Verified</th><th>Actions</th></tr></thead><tbody>
                    ${students.length?students.map(s=>`<tr><td>${esc(s.full_name||'N/A')}</td><td>${esc(s.mobile||s.phone||'N/A')}</td><td>${esc(s.email||'N/A')}</td><td>${(s.verified===true||s.is_verified===true||s.phone_verified===true)?'<span class="badge badge-published">Verified</span>':'<span class="badge">Unverified/Unknown</span>'}</td><td><button class="btn btn-danger btn-sm" onclick="proRemoveStudent('${esc(s.id)}')">Remove Profile</button></td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;">No students found</td></tr>'}
                    </tbody></table></div>
                </div>
                <div class="card" style="margin-top:1rem;"><p style="color:var(--gray-500);"><strong>Note:</strong> A static browser admin panel cannot delete a Supabase Auth account securely. “Remove Profile” deletes the profile row only; full Auth-user deletion should be done through a protected Edge Function/service role.</p></div>`;
        }catch(e){container.innerHTML=`<div class="card"><p style="color:var(--red-500);">Error loading students: ${esc(e.message)}</p></div>`;}
    };
    window.proRemoveStudent=async(id)=>{
        if(!confirm('Remove this student profile from the database?'))return;
        try{const {error}=await supabaseClient.from('profile').delete().eq('id',id);if(error)throw error;showToast('Student profile removed','success');switchPage('students');}
        catch(e){showToast('Unable to remove student: '+e.message,'error');}
    };

    /* ---------- Website settings: richer editor ---------- */
    window.renderSettings = async function(container){
        container.innerHTML='<div class="card"><p>Loading website settings...</p></div>';
        try{
            const s=await proGetSettings();
            container.innerHTML=`
            <div class="card">
              <div class="card-header"><div><h2 class="card-title">Website Settings</h2><p style="color:var(--gray-500);">Control colors, homepage copy, navigation labels and academic structure.</p></div></div>
              <h3>Brand & Colors</h3>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">
              ${['primary_color','secondary_color','accent_color','background_color','text_color'].map(k=>`<div class="form-group"><label>${k.replaceAll('_',' ')}</label><input type="color" class="form-input" id="pro_${k}" value="${esc(s[k]||'#000000')}" style="height:50px;padding:.2rem;"></div>`).join('')}</div>
              <h3>Homepage</h3>
              <div class="form-group"><label>Hero Title</label><textarea class="form-input" id="pro_hero_title" rows="2">${esc(s.hero_title)}</textarea></div>
              <div class="form-group"><label>Hero Subtitle</label><textarea class="form-input" id="pro_hero_subtitle" rows="3">${esc(s.hero_subtitle)}</textarea></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">${['hero_button_1','hero_button_2','quick_access_title','materials_title','roadmaps_title','news_title'].map(k=>`<div class="form-group"><label>${k.replaceAll('_',' ')}</label><input class="form-input" id="pro_${k}" value="${esc(s[k]||'')}"></div>`).join('')}</div>
              <h3>Extra homepage blocks</h3>
              <div class="form-group"><label>Announcement</label><input class="form-input" id="pro_announcement" value="${esc(s.announcement||'')}"></div>
              <div class="form-group"><label>Footer Text</label><input class="form-input" id="pro_footer_text" value="${esc(s.footer_text||'PADHAKU — Learn. Practice. Succeed.')}"></div>
              <button class="btn btn-gold" onclick="proSaveWebsiteSettings()">Save Website Settings</button>
            </div>`;
        }catch(e){container.innerHTML=`<div class="card"><p style="color:var(--red-500);">${esc(e.message)}</p></div>`;}
    };
    window.proSaveWebsiteSettings=async()=>{
        const keys=['primary_color','secondary_color','accent_color','background_color','text_color','hero_title','hero_subtitle','hero_button_1','hero_button_2','quick_access_title','materials_title','roadmaps_title','news_title','announcement','footer_text'];
        const patch={}; keys.forEach(k=>{const el=document.getElementById('pro_'+k);if(el)patch[k]=el.value;});
        try{await proSaveSettings(patch);showToast('Website settings saved','success');}catch(e){showToast('Unable to save settings: '+e.message,'error');}
    };
})();
</script>

</body>
</html>
