<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADHAKU Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --navy-900: #102a43; --navy-800: #243b53; --navy-700: #334e68;
            --navy-600: #486581; --navy-500: #627d98; --navy-400: #829ab1;
            --navy-300: #9fb3c8; --navy-200: #bcccdc; --navy-100: #d9e2ec;
            --navy-50: #f0f4f8; --gold-500: #f59e0b; --gold-600: #d97706;
            --gold-100: #fef3c7; --white: #ffffff; --gray-50: #f9fafb;
            --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db;
            --gray-500: #6b7280; --gray-700: #374151; --red-500: #ef4444;
            --red-100: #fee2e2; --green-500: #10b981; --green-100: #d1fae5;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1);
            --radius-sm: 0.375rem; --radius-md: 0.5rem;
            --radius-lg: 0.75rem; --radius-xl: 1rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-50); color: var(--navy-900); line-height: 1.6; overflow-x: hidden; }
        h1,h2,h3,h4,h5,h6 { font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; }
        input, select, textarea { font-family: inherit; outline: none; }

        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%); padding: 1rem; }
        .login-card { background: var(--white); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 400px; width: 100%; box-shadow: var(--shadow-xl); }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo h1 { font-size: 2rem; color: var(--navy-900); }
        .login-logo span { color: var(--gold-500); }
        .login-logo p { color: var(--gray-500); font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--navy-700); font-size: 0.9rem; }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--navy-200); border-radius: var(--radius-md); font-size: 1rem; transition: all 0.2s; }
        .form-input:focus { border-color: var(--navy-500); box-shadow: 0 0 0 3px rgba(51,78,104,0.1); }
        .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.9rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--navy-800); color: var(--white); }
        .btn-primary:hover { background: var(--navy-900); }
        .btn-gold { background: var(--gold-500); color: var(--white); }
        .btn-gold:hover { background: var(--gold-600); }
        .btn-danger { background: var(--red-500); color: var(--white); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: var(--white); color: var(--navy-700); border: 1px solid var(--navy-200); }
        .btn-outline:hover { background: var(--navy-50); }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }
        .btn-block { width: 100%; justify-content: center; }

        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--navy-900); color: var(--white); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--navy-700); }
        .sidebar-header h2 { font-size: 1.5rem; color: var(--gold-500); }
        .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--navy-300); transition: all 0.2s; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .sidebar-link:hover { background: var(--navy-800); color: var(--white); }
        .sidebar-link.active { background: var(--navy-800); color: var(--gold-500); border-left: 3px solid var(--gold-500); }
        .sidebar-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--navy-700); }
        .main-content { flex: 1; margin-left: 250px; padding: 2rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; }
        .topbar h1 { font-size: 1.75rem; }
        .hamburger { display: none; background: var(--navy-800); color: var(--white); padding: 0.5rem; border-radius: var(--radius-md); font-size: 1.25rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); }
        .stat-card h3 { font-size: 0.9rem; color: var(--gray-500); margin-bottom: 0.5rem; }
        .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: var(--navy-900); }
        .card { background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .card-title { font-size: 1.25rem; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem; background: var(--navy-50); color: var(--navy-700); font-weight: 600; font-size: 0.875rem; white-space: nowrap; }
        td { padding: 0.75rem; border-bottom: 1px solid var(--gray-200); font-size: 0.875rem; }
        tr:hover { background: var(--gray-50); }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-published { background: var(--green-100); color: var(--green-500); }
        .badge-draft { background: var(--gray-100); color: var(--gray-500); }
        .badge-admin { background: var(--gold-100); color: var(--gold-600); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s; }
        .modal { background: var(--white); border-radius: var(--radius-xl); padding: 2rem; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--navy-900); color: var(--white); padding: 1rem 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); z-index: 300; animation: slideUp 0.3s; }
        .toast-success { background: var(--green-500); }
        .toast-error { background: var(--red-500); }
        .hidden { display: none !important; }
        .role-banner { padding: .75rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1rem; font-size: .9rem; }
        .role-banner.owner { background: var(--gold-100); color: var(--gold-600); }
        .role-banner.helper { background: var(--navy-50); color: var(--navy-700); border: 1px solid var(--navy-100); }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--navy-200); border-top-color: var(--navy-800); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .hamburger { display: block; }
            .topbar h1 { font-size: 1.25rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .modal { padding: 1.5rem; margin: 0.5rem; }
        }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; }
        .sidebar-overlay.open { display: block; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <h1>PADHAKU<span>.</span></h1>
                <p>Admin Panel</p>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" onkeypress="if(event.key==='Enter') handleLogin()">
                </div>
                <div id="loginError" class="hidden" style="color: var(--red-500); margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button class="btn btn-gold btn-block" onclick="handleLogin()" id="loginBtn">Login</button>
            </div>
            <div id="loginLoading" class="hidden" style="text-align: center; padding: 2rem;">
                <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px;"></div>
                <p style="margin-top: 1rem; color: var(--gray-500);">Authenticating...</p>
            </div>
        </div>
    </div>

    <!-- Admin Layout -->
    <div id="adminLayout" class="admin-layout hidden">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>PADHAKU Admin</h2>
                <p style="font-size: 0.8rem; color: var(--navy-300);">Content Management</p>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-link active" data-page="dashboard" onclick="switchPage('dashboard')">📊 Dashboard</div>
                <div class="sidebar-link" data-page="materials" onclick="switchPage('materials')">📚 Study Materials</div>
                <div class="sidebar-link" data-page="about" onclick="switchPage('about')">👤 About Padhaku</div>
                <div class="sidebar-link" data-page="subjects" onclick="switchPage('subjects')">📖 Subjects</div>
                <div class="sidebar-link" data-page="videos" onclick="switchPage('videos')">🎬 Videos</div>
                <div class="sidebar-link" data-page="news" onclick="switchPage('news')">📰 News</div>
                <div class="sidebar-link" data-page="current-affairs" onclick="switchPage('current-affairs')">🌍 Current Affairs</div>
                <div class="sidebar-link" data-page="tests" onclick="switchPage('tests')">✍️ Tests & Quizzes</div>
                <div class="sidebar-link" data-page="roadmaps" onclick="switchPage('roadmaps')">🗺️ Roadmaps</div>
                <div class="sidebar-link" data-page="students" onclick="switchPage('students')">👨‍🎓 Students</div>
                <div class="sidebar-link" data-page="settings" onclick="switchPage('settings')">⚙️ Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="adminName" style="font-weight: 600; color: var(--navy-700);"></span>
                </div>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>

    <div class="toast hidden" id="toast"></div>
    <div id="modalContainer"></div>

    <script>
    // ==================== SUPABASE ====================
    const SUPABASE_URL = 'https://ozrvpbziwpkfkejafjnm.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aeCYoS9jRAAqPHIGa6Uz6Q_XY_7l7Lj';
    let supabaseClient = null;

    function initializeSupabase() {
        try {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                throw new Error('Supabase library failed to load.');
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
                auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
            });
            return true;
        } catch (error) {
            console.error('Supabase init failed:', error);
            supabaseClient = null;
            return false;
        }
    }
    initializeSupabase();

    // ==================== STATE ====================
    let currentPage = 'dashboard';
    let currentUser = null;
    let currentProfile = null;

    // ==================== ROLE / PERMISSIONS ====================
    const OWNER_ROLE = 'admin';
    const CONTENT_MANAGER_ROLE = 'content_manager';
    const CONTENT_MANAGER_PAGES = new Set([
        'dashboard', 'materials', 'subjects', 'videos', 'news',
        'current-affairs', 'tests', 'roadmaps'
    ]);
    const OWNER_ONLY_PAGES = new Set(['about', 'students', 'settings']);

    function getCurrentRole() {
        return String(currentProfile?.role || '').trim().toLowerCase();
    }
    function isOwner() { return getCurrentRole() === OWNER_ROLE; }
    function isContentManager() { return getCurrentRole() === CONTENT_MANAGER_ROLE; }
    function canAccessPage(page) {
        if (isOwner()) return true;
        return isContentManager() && CONTENT_MANAGER_PAGES.has(page);
    }

    const defaultSiteSettings = {
        primary_color: '#102a43', secondary_color: '#243b53', accent_color: '#f59e0b',
        background_color: '#ffffff', text_color: '#102a43',
        hero_title: 'Learn Today.\nPrepare for Tomorrow.',
        hero_subtitle: 'Study materials, video lectures, notes, practice questions, current affairs and preparation roadmaps—all in one place.',
        hero_button_1: '📚 Explore Classes', hero_button_2: '🎯 Competitive Exams',
        quick_access_title: 'Quick Access', materials_title: 'Latest Study Materials',
        roadmaps_title: 'Popular Roadmaps', news_title: 'Education News',
        announcement: '', footer_text: 'PADHAKU — Learn. Practice. Succeed.'
    };

    const defaultSeniorStreams = [
        { name: 'Science', subjects: ['Physics', 'Chemistry', 'Mathematics', 'Biology', 'English'] },
        { name: 'Commerce', subjects: ['Accountancy', 'Business Studies', 'Economics', 'Mathematics', 'English'] },
        { name: 'Humanities / Arts', subjects: ['History', 'Political Science', 'Geography', 'Economics', 'Sociology', 'Psychology', 'English'] }
    ];

    const defaultStructure = {
        classes: Array.from({length: 12}, (_, i) => ({
            id: i + 1,
            name: `Class ${i+1}`,
            subjects: [],
            ...(i >= 10 ? { streams: JSON.parse(JSON.stringify(defaultSeniorStreams)) } : {})
        })),
        streams: JSON.parse(JSON.stringify(defaultSeniorStreams))
    };

    // ==================== HELPERS ====================
    function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast';
        if (type === 'success') toast.classList.add('toast-success');
        else if (type === 'error') toast.classList.add('toast-error');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function getSettings() {
        const { data, error } = await supabaseClient.from('site_settings').select('settings').eq('id', 1).maybeSingle();
        if (error) throw error;
        return { ...defaultSiteSettings, ...(data?.settings || {}) };
    }

    async function saveSettings(patch) {
        const current = await getSettings();
        const next = { ...current, ...patch };
        const { error } = await supabaseClient.from('site_settings').upsert({ id: 1, settings: next, updated_at: new Date().toISOString() });
        if (error) throw error;
        return next;
    }

    async function getStructure() {
        const s = await getSettings();
        return s.academic_structure || JSON.parse(JSON.stringify(defaultStructure));
    }

    async function saveStructure(structure) {
        if (isContentManager()) {
            const { error } = await supabaseClient.rpc('update_academic_structure', {
                p_structure: structure
            });
            if (error) throw error;
            return;
        }
        await saveSettings({ academic_structure: structure });
    }

    // ==================== AUTH ====================
    async function checkSession() {
        if (!supabaseClient) { showLoginError('Auth service failed. Refresh page.'); return; }
        try {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error) throw error;
            if (session) await verifyAdmin(session.user);
        } catch (e) { console.error(e); }
    }

    async function verifyAdmin(user) {
        if (!supabaseClient) return false;
        try {
            const { data: profile, error } = await supabaseClient.from('profile').select('*').eq('id', user.id).single();
            if (error) throw error;
            const role = String(profile?.role || '').trim().toLowerCase();
            if (profile && (role === OWNER_ROLE || role === CONTENT_MANAGER_ROLE)) {
                currentUser = user;
                currentProfile = profile;
                showAdminPanel();
                return true;
            } else {
                await supabaseClient.auth.signOut();
                showLoginError('Access denied. This account is not authorized for PADHAKU Admin Panel.');
                return false;
            }
        } catch (e) {
            console.error(e);
            await supabaseClient.auth.signOut();
            showLoginError(e.message || 'Unable to verify admin.');
            return false;
        }
    }

    async function handleLogin() {
        const errorEl = document.getElementById('loginError');
        errorEl.classList.add('hidden');
        if (!supabaseClient) { showLoginError('Auth service not loaded.'); return; }
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showLoginError('Enter email and password'); return; }
        showLoginLoading(true);
        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            if (data.user) await verifyAdmin(data.user);
        } catch (e) { showLoginError(e.message || 'Login failed'); }
        finally { showLoginLoading(false); }
    }

    async function handleLogout() {
        try {
            await supabaseClient.auth.signOut();
            currentUser = null; currentProfile = null;
            showLoginScreen();
            showToast('Logged out', 'success');
        } catch (e) { showToast('Error logging out', 'error'); }
    }

    function showLoginScreen() {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminLayout').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('loginLoading').classList.add('hidden');
    }

    function showAdminPanel() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminLayout').classList.remove('hidden');
        const roleLabel = isOwner() ? 'Owner' : 'Content Manager';
        document.getElementById('adminName').textContent = `${currentProfile?.full_name || currentUser?.email || 'User'} • ${roleLabel}`;
        applyRoleToSidebar();
        switchPage('dashboard');
    }

    function showLoginError(message) {
        const el = document.getElementById('loginError');
        el.textContent = message;
        el.classList.remove('hidden');
    }

    function showLoginLoading(show) {
        document.getElementById('loginForm').classList.toggle('hidden', show);
        document.getElementById('loginLoading').classList.toggle('hidden', !show);
        document.getElementById('loginBtn').disabled = show;
    }

    // ==================== SIDEBAR ====================
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    }

    function applyRoleToSidebar() {
        document.querySelectorAll('.sidebar-link').forEach(link => {
            const page = link.dataset.page;
            const allowed = canAccessPage(page);
            link.style.display = allowed ? '' : 'none';
            link.setAttribute('aria-hidden', allowed ? 'false' : 'true');
        });
        const header = document.querySelector('.sidebar-header p');
        if (header) {
            header.textContent = isOwner() ? 'Owner • Full Control' : 'Content Manager • Content Only';
        }
    }

    function switchPage(page) {
        if (!canAccessPage(page)) {
            showToast('You do not have permission to open this section.', 'error');
            if (page !== 'dashboard') switchPage('dashboard');
            return;
        }
        currentPage = page;
        applyRoleToSidebar();
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.classList.remove('active');
            if (link.dataset.page === page) link.classList.add('active');
        });
        const titles = {
            'dashboard': 'Dashboard', 'materials': 'Study Materials', 'about': 'About Padhaku',
            'subjects': 'Subjects', 'videos': 'Videos', 'news': 'News',
            'current-affairs': 'Current Affairs', 'tests': 'Tests & Quizzes',
            'roadmaps': 'Roadmaps', 'students': 'Students', 'settings': 'Settings'
        };
        document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
        if (window.innerWidth <= 768) toggleSidebar();
        const content = document.getElementById('pageContent');
        switch(page) {
            case 'dashboard': renderDashboard(content); break;
            case 'materials': renderMaterials(content); break;
            case 'about': renderAboutPadhaku(content); break;
            case 'subjects': renderSubjects(content); break;
            case 'videos': renderVideos(content); break;
            case 'news': renderNews(content); break;
            case 'current-affairs': renderCurrentAffairs(content); break;
            case 'tests': renderTests(content); break;
            case 'roadmaps': renderRoadmaps(content); break;
            case 'students': renderStudents(content); break;
            case 'settings': renderSettings(content); break;
        }
    }

    // ==================== DASHBOARD ====================
    async function renderDashboard(container) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="loading-spinner"></div></div>';
        try {
            const profileCountPromise = isOwner()
                ? supabaseClient.from('profile').select('*', { count: 'exact', head: true })
                : Promise.resolve({ count: null, error: null });
            const [s, m, v, n, ca, t] = await Promise.all([
                profileCountPromise,
                supabaseClient.from('materials').select('*', { count: 'exact', head: true }),
                supabaseClient.from('videos').select('*', { count: 'exact', head: true }),
                supabaseClient.from('news').select('*', { count: 'exact', head: true }),
                supabaseClient.from('current_affairs').select('*', { count: 'exact', head: true }),
                supabaseClient.from('tests').select('*', { count: 'exact', head: true })
            ]);
            container.innerHTML = `
                <div class="role-banner ${isOwner() ? 'owner' : 'helper'}">
                    <strong>${isOwner() ? 'Owner access' : 'Content Manager access'}</strong> — ${isOwner() ? 'You have full control over PADHAKU.' : 'You can manage content sections only. Owner-only areas are hidden.'}
                </div>
                <div class="stats-grid">
                    ${isOwner() ? `<div class="stat-card"><h3>Total Users</h3><div class="stat-value">${s.count || 0}</div></div>` : ''}

    const SITE_MEDIA_BUCKET = 'site-media';

    function mediaSafeName(name) {
        return String(name || 'file')
            .replace(/[^a-zA-Z0-9._-]+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
    }

    async function uploadSiteMedia(file, folder = 'general') {
        if (!file) throw new Error('No file selected.');
        if (!supabaseClient) throw new Error('Supabase client is not ready.');

        const safeName = mediaSafeName(file.name || 'file');
        const uuid = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const path = `${folder}/${Date.now()}-${uuid}-${safeName}`;

        const { error } = await supabaseClient.storage
            .from(SITE_MEDIA_BUCKET)
            .upload(path, file, { cacheControl: '3600', upsert: false });

        if (error) throw error;

        const { data } = supabaseClient.storage
            .from(SITE_MEDIA_BUCKET)
            .getPublicUrl(path);

        if (!data?.publicUrl) throw new Error('Could not create public file URL.');
        return data.publicUrl;
    }

    // Generic image upload used by every image field in the admin panel.
    // The public URL is written into the matching DB URL field, so the user panel can display it after publish.
    window.handleAdminImageUpload = async function(input, targetInputId, folder, previewId = null) {
        const file = input?.files?.[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) {
            showToast('Please select an image file.', 'error');
            input.value = '';
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            showToast('Image is too large. Maximum size is 10 MB.', 'error');
            input.value = '';
            return;
        }
        const target = document.getElementById(targetInputId);
        if (!target) {
            showToast('Image field could not be found.', 'error');
            input.value = '';
            return;
        }
        try {
            const url = await uploadSiteMedia(file, folder);
            target.value = url;
            if (previewId) {
                const preview = document.getElementById(previewId);
                if (preview) {
                    preview.src = url;
                    preview.style.display = 'block';
                }
            }
            showToast('Image uploaded successfully ✓', 'success');
        } catch (e) {
            console.error('Image upload:', e);
            showToast('Image upload failed: ' + e.message, 'error');
        } finally {
            input.value = '';
        }
    };

        const value = String(input?.value || '').trim();

    // ==================== SUBJECTS (Classes 1–12 → Subject → Chapter → Resources) ====================

    const subjectManager = {
        structure: null,
        materials: [],
        classIndex: 0,
        streamIndex: 0
    };

    function subjectObject(value) {
        if (typeof value === 'string') return { name: value, chapters: [] };
        return {
            name: value?.name || 'Untitled Subject',
            chapters: Array.isArray(value?.chapters) ? [...value.chapters] : []
        };
    }

    function normalizeAcademicStructure(structure) {
        const working = JSON.parse(JSON.stringify(structure || defaultStructure));
        working.classes = Array.isArray(working.classes) ? working.classes : [];

        working.classes.forEach((c, index) => {
            c.id = c.id ?? index + 1;
            c.name = c.name || `Class ${index + 1}`;
            c.subjects = Array.isArray(c.subjects)
                ? c.subjects.map(subjectObject)
                : [];

            if (Number(c.id) >= 11) {
                const sourceStreams = Array.isArray(c.streams)
                    ? c.streams
                    : (Array.isArray(working.streams) ? working.streams : defaultSeniorStreams);

                c.streams = sourceStreams.map(stream => ({
                    name: stream?.name || 'Untitled Stream',
                    subjects: Array.isArray(stream?.subjects)
                        ? stream.subjects.map(subjectObject)
                        : []
                }));
            }
        });

        if (!Array.isArray(working.streams)) working.streams = JSON.parse(JSON.stringify(defaultSeniorStreams));
        return working;
    }

    async function loadSubjectManager() {
        const structure = await getStructure();
        const normalized = normalizeAcademicStructure(structure);

        // PADHAKU always exposes Classes 1–12 from this Subject workspace.
        // Preserve any existing class names/data and append missing classes.
        for (let i = normalized.classes.length; i < 12; i++) {
            normalized.classes.push({ id: i + 1, name: `Class ${i + 1}`, subjects: [] });
        }
        let structureChanged = normalized.classes.length !== (structure.classes || []).length;

        const { data, error } = await supabaseClient
            .from('materials')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        subjectManager.structure = normalized;
        subjectManager.materials = data || [];

        if (subjectManager.classIndex >= normalized.classes.length) {
            subjectManager.classIndex = Math.max(0, normalized.classes.length - 1);
        }

        // Migrate old string subjects into object form once.
        const needsMigration = (structure.classes || []).some(c =>
            (c.subjects || []).some(s => typeof s === 'string')
        );

        if (needsMigration || structureChanged) {
            await saveStructure(normalized);
        }
    }

    function subjectResources(className, subjectName, chapter = null, streamName = null) {
        return (subjectManager.materials || []).filter(m =>
            String(m.class || '').trim() === String(className || '').trim() &&
            String(m.subject || '').trim() === String(subjectName || '').trim() &&
            (streamName === null || String(m.stream || '').trim() === String(streamName || '').trim()) &&
            (chapter === null || String(m.chapter || '').trim() === String(chapter || '').trim())
        );
    }

    function allChaptersFor(className, subject, streamName = null) {
        const set = new Set((subject.chapters || []).filter(Boolean).map(v => String(v).trim()));
        subjectResources(className, subject.name, null, streamName).forEach(resource => {
            if (resource.chapter) set.add(String(resource.chapter).trim());
        });
        return [...set];
    }

    function isSeniorClass(cls) {
        return Number(cls?.id) >= 11 || /11|12/.test(String(cls?.name || ''));
    }

    function getActiveSubjectContext() {
        const currentClass = subjectManager.structure?.classes?.[subjectManager.classIndex];
        if (!currentClass) return { currentClass: null, stream: null, subjects: [] };

        if (isSeniorClass(currentClass)) {
            currentClass.streams = Array.isArray(currentClass.streams) ? currentClass.streams : [];
            if (subjectManager.streamIndex >= currentClass.streams.length) subjectManager.streamIndex = 0;
            const stream = currentClass.streams[subjectManager.streamIndex] || null;
            return { currentClass, stream, subjects: stream?.subjects || [] };
        }

        currentClass.subjects = Array.isArray(currentClass.subjects) ? currentClass.subjects : [];
        return { currentClass, stream: null, subjects: currentClass.subjects };
    }

    function setSeniorStream(index) {
        subjectManager.streamIndex = Number(index) || 0;
        subjectManagerRender();
    }

    async function subjectNameModal(title, helpText, placeholder, onSave) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';

            modal.innerHTML = `
                <div class="modal" style="max-width:520px;">
                    <button class="modal-close" type="button"
                            onclick="this.closest('.modal-overlay').remove()">×</button>
                    <h2 style="margin-bottom:.5rem;">${esc(title)}</h2>
                    <p style="color:var(--gray-500);margin-bottom:1rem;">${esc(helpText)}</p>
                    <div class="form-group">
                        <label>Name *</label>
                        <input id="subjectManagerName" class="form-input" placeholder="${esc(placeholder)}" autocomplete="off">
                    </div>
                    <div style="display:flex;gap:.5rem;justify-content:flex-end;">
                        <button class="btn btn-outline" type="button"
                                onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                        <button class="btn btn-gold" type="button" id="subjectManagerSave">Save</button>
                    </div>
                </div>
            `;

            document.getElementById('modalContainer').appendChild(modal);

            const input = document.getElementById('subjectManagerName');
            const saveBtn = document.getElementById('subjectManagerSave');

            const submit = async () => {
                const name = input.value.trim();
                if (!name) {
                    showToast('Please enter a name.', 'error');
                    input.focus();
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    await onSave(name);
                    modal.remove();
                    resolve(true);
                } catch (error) {
                    console.error(error);
                    showToast('Error: ' + error.message, 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save';
                }
            };

            saveBtn.addEventListener('click', submit);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') submit();
                if (e.key === 'Escape') modal.remove();
            });

            setTimeout(() => input.focus(), 50);
        });
    }

    window.subjectAddStream = async function() {

        if (!isSeniorClass(currentClass)) return;
        await subjectNameModal('Add Stream', `Add a stream inside ${currentClass.name}.`, 'Example: Commerce', async name => {
            currentClass.streams = Array.isArray(currentClass.streams) ? currentClass.streams : [];
            if (currentClass.streams.some(s => String(s.name).toLowerCase() === name.toLowerCase())) throw new Error('This stream already exists.');
            currentClass.streams.push({name, subjects: []});
            subjectManager.streamIndex = currentClass.streams.length - 1;

    window.subjectAddSubject = async function() {

        if (!currentClass) return;

        await subjectNameModal(
            'Add Subject',
            `Add a subject inside ${currentClass.name}${stream ? ` → ${stream.name}` : ''}.`,

    window.subjectRenameSubject = async function(subjectIndex, value) {
        const name = value.trim();
        if (!name) { showToast('Subject name cannot be empty.', 'error'); return; }

        const { currentClass, stream, subjects } = getActiveSubjectContext();
        const target = subjectObject(subjects[subjectIndex]);
        const oldName = target.name;
        if (subjects.some((s,i)=>i!==subjectIndex && subjectObject(s).name.toLowerCase()===name.toLowerCase())) {
            showToast('A subject with this name already exists.', 'error');
            subjectManagerRender();
            return;
        }

        target.name = name;
        subjects[subjectIndex] = target;

        const resources = subjectManager.materials.filter(m =>
            String(m.class||'')===String(currentClass.name||'') &&
            String(m.subject||'')===String(oldName||'') &&
            (!stream || String(m.stream||'')===String(stream.name||''))
        );
        for (const resource of resources) {
            const {error}=await supabaseClient.from('materials').update({subject:name}).eq('id',resource.id);
            if(error) throw error;
        }
        await saveStructure(subjectManager.structure);
        showToast('Subject renamed.', 'success');
        await refreshSubjectManager();
    };

    window.subjectDeleteSubject = async function(subjectIndex) {
        const { currentClass, stream, subjects } = getActiveSubjectContext();
        const subject = subjectObject(subjects[subjectIndex]);
        if (!confirm(`Delete "${subject.name}" from ${currentClass.name}${stream ? ` → ${stream.name}` : ''}?`)) return;
        subjects.splice(subjectIndex, 1);
        await saveStructure(subjectManager.structure);
        showToast('Subject deleted.', 'success');
        await refreshSubjectManager();
    };

    window.subjectAddChapter = async function(subjectIndex) {

        await subjectNameModal('Add Chapter',
            `Add a chapter inside ${currentClass.name}${stream ? ` → ${stream.name}` : ''} → ${subject.name}.`,
            'Example: Chapter 1 - Introduction',
            async name => {
                subject.chapters = Array.isArray(subject.chapters) ? subject.chapters : [];
                if (subject.chapters.some(ch=>String(ch).toLowerCase()===name.toLowerCase())) throw new Error(`Chapter "${name}" already exists.`);
                subject.chapters.push(name);
                subjects[subjectIndex]=subject;

    window.subjectRenameChapter = async function(subjectIndex, oldName) {
        const { currentClass, stream, subjects } = getActiveSubjectContext();
        const subject = subjectObject(subjects[subjectIndex]);
        await subjectNameModal('Rename Chapter', `Rename "${oldName}" inside ${subject.name}.`, 'New chapter name', async name => {
            if (subject.chapters.some(ch=>ch!==oldName && String(ch).toLowerCase()===name.toLowerCase())) throw new Error(`Chapter "${name}" already exists.`);
            const chapterIndex=subject.chapters.indexOf(oldName);
            if(chapterIndex>=0) subject.chapters[chapterIndex]=name;
            const resources=subjectManager.materials.filter(m=>
                String(m.class||'')===String(currentClass.name||'') &&
                String(m.subject||'')===String(subject.name||'') &&
                String(m.chapter||'')===String(oldName||'') &&
                (!stream || String(m.stream||'')===String(stream.name||''))
            );
            for(const resource of resources){
                const {error}=await supabaseClient.from('materials').update({chapter:name}).eq('id',resource.id);
                if(error) throw error;
            }
            subjects[subjectIndex]=subject;
            await saveStructure(subjectManager.structure);
            showToast('Chapter renamed.', 'success');
            await refreshSubjectManager();
        });
    };

    async function openSubjectResourceModal(resource, className, subjectName, chapterName, streamName = null) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';

        modal.innerHTML = `
            <div class="modal" style="max-width:720px;max-height:90vh;overflow-y:auto;">
                <h2 style="margin-bottom:.5rem;">${resource ? 'Edit' : 'Add'} Resource</h2>
                <p style="color:var(--gray-500);margin-bottom:1.25rem;">
                    ${esc(className)}${streamName ? ` → ${esc(streamName)}` : ''} → ${esc(subjectName)} → ${esc(chapterName)}
                </p>
                <div id="subjectResourceForm"></div>
                <div style="display:flex;gap:.5rem;margin-top:1.25rem;">
                    <button class="btn btn-primary" id="subjectResourceSave">Save Resource</button>
                    <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                </div>
            </div>
        `;

        document.getElementById('modalContainer').appendChild(modal);
        document.getElementById('subjectResourceForm').innerHTML =
            subjectResourceFormHTML(resource, className, subjectName, chapterName, streamName);

        document.getElementById('subjectResourceSave').onclick = async () => {
            const payload = {
                title: document.getElementById('smrTitle').value.trim(),
                description: document.getElementById('smrDescription').value.trim(),
                class: className,
                stream: streamName || null,
                subject: subjectName,
                chapter: chapterName,
                type: document.getElementById('smrType').value,
                thumbnail_url: document.getElementById('smrThumbnail').value.trim(),
                youtube_url: document.getElementById('smrYoutube').value.trim(),
                resource_url: document.getElementById('smrResourceUrl').value.trim(),
                download_url: document.getElementById('smrDownload').value.trim() || null,
                published: document.getElementById('smrPublished').checked
            };

            if (!payload.title) {
                showToast('Resource title is required.', 'error');
                return;
            }

            const saveButton = document.getElementById('subjectResourceSave');
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';

            try {
                let result;

                if (resource?.id) {
                    result = await supabaseClient
                        .from('materials')
                        .update(payload)
                        .eq('id', resource.id);
                } else {
                    result = await supabaseClient
                        .from('materials')
                        .insert(payload)
                        .select();
                }

                if (result.error) {
                    // Backward compatibility in case download_url was not migrated.
                    if (/download_url|column/i.test(result.error.message || '')) {
                        const fallback = { ...payload };
                        delete fallback.download_url;

                        result = resource?.id
                            ? await supabaseClient.from('materials').update(fallback).eq('id', resource.id)
                            : await supabaseClient.from('materials').insert(fallback).select();
                    }
                }

                if (result.error) throw result.error;

                modal.remove();
                showToast(resource?.id ? 'Resource updated.' : 'Resource added.', 'success');
                await refreshSubjectManager();
            } catch (error) {
                console.error(error);
                showToast('Error: ' + error.message, 'error');
                saveButton.disabled = false;
                saveButton.textContent = 'Save Resource';
            }
        };
    }

            );

            <div style="border:1px solid var(--navy-200);border-radius:12px;padding:1rem;margin-bottom:1rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">

                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                    <div class="form-group"><label>Option A</label><input type="text" class="form-input" value="${esc(q.option_a)}" onchange="updateQ(${i},'option_a',this.value)"></div>
                    <div class="form-group"><label>Option B</label><input type="text" class="form-input" value="${esc(q.option_b)}" onchange="updateQ(${i},'option_b',this.value)"></div>
                    <div class="form-group"><label>Option C</label><input type="text" class="form-input" value="${esc(q.option_c)}" onchange="updateQ(${i},'option_c',this.value)"></div>
                    <div class="form-group"><label>Option D</label><input type="text" class="form-input" value="${esc(q.option_d)}" onchange="updateQ(${i},'option_d',this.value)"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label>Correct Answer</label><select class="form-input" onchange="updateQ(${i},'correct_answer',this.value)">
                        ${['A','B','C','D'].map(x => `<option ${q.correct_answer === x ? 'selected' : ''}>${x}</option>`).join('')}
                    </select></div>
                    <div class="form-group"><label>Explanation</label><input type="text" class="form-input" value="${esc(q.explanation)}" onchange="updateQ(${i},'explanation',this.value)"></div>
                </div>
            </div>
        `).join('');
    }

    function updateQ(i, key, val) { window._questions[i][key] = val; }
    function removeQuestion(i) { window._questions.splice(i, 1); renderQuestionsList(); }

    async function saveTest(id) {
        const title = document.getElementById('testTitle').value.trim();
        if (!title) { showToast('Title required', 'error'); return; }
        const testData = {
            title,
            class: document.getElementById('testClass').value,
            subject: document.getElementById('testSubject').value.trim(),
            duration: parseInt(document.getElementById('testDuration').value) || 30,
            description: document.getElementById('testDescription').value.trim(),
            published: document.getElementById('testPublished').checked
        };
        try {
            let testResult;
            if (id) testResult = await supabaseClient.from('tests').update(testData).eq('id', id);
            else testResult = await supabaseClient.from('tests').insert(testData).select();
            if (testResult.error) throw testResult.error;
            const savedId = id || testResult.data[0].id;
            if (id) await supabaseClient.from('test_questions').delete().eq('test_id', id);
            const questions = window._questions.filter(q => q.question).map((q, i) => ({ ...q, test_id: savedId, question_order: i }));
            if (questions.length > 0) {
                const { error } = await supabaseClient.from('test_questions').insert(questions);
                if (error) throw error;
            }
            document.querySelector('.modal-overlay')?.remove();
            showToast('Test saved!', 'success');
            switchPage('tests');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

        if (!confirm('Delete this test?')) return;
        try {
            const { error } = await supabaseClient.from('tests').delete().eq('id', id);

            showToast('Deleted', 'success');
            switchPage('tests');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    function removeStep(i) { window._steps.splice(i, 1); renderStepsList(); }

    async function saveRoadmap(id) {
        const examName = document.getElementById('rmExamName').value.trim();
        if (!examName) { showToast('Name required', 'error'); return; }
        const payload = {
            exam_name: examName,
            duration: document.getElementById('rmDuration').value.trim(),
            difficulty: document.getElementById('rmDifficulty').value,
            description: document.getElementById('rmDescription').value.trim(),
            diagram_url: document.getElementById('rmDiagramUrl').value.trim() || null,
            published: document.getElementById('rmPublished').checked
        };
        try {
            let result;
            if (id) result = await supabaseClient.from('roadmaps').update(payload).eq('id', id);
            else result = await supabaseClient.from('roadmaps').insert(payload).select();
            if (result.error) throw result.error;
            const savedId = id || result.data[0].id;
            if (id) await supabaseClient.from('roadmap_steps').delete().eq('roadmap_id', id);
            const steps = window._steps.filter(s => s.month || s.title).map((s, i) => ({
                roadmap_id: savedId, month: s.month, title: s.title,
                subjects: s.subjects.split(',').map(x => x.trim()).filter(Boolean),
                topics: s.topics.split(',').map(x => x.trim()).filter(Boolean),
                step_order: i
            }));
            if (steps.length > 0) {
                const { error } = await supabaseClient.from('roadmap_steps').insert(steps);
                if (error) throw error;
            }
            document.querySelector('.modal-overlay')?.remove();
            showToast('Roadmap saved!', 'success');
            switchPage('roadmaps');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function deleteRoadmap(id) {
        if (!confirm('Delete this roadmap?')) return;
        try {
            const { error } = await supabaseClient.from('roadmaps').delete().eq('id', id);
            if (error) throw error;
            showToast('Deleted', 'success');
            switchPage('roadmaps');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    // ==================== STUDENTS ====================
    async function renderStudents(container) {
        if (!isOwner()) {
            container.innerHTML = '<div class="card"><p style="color:var(--red-500);">Owner-only section.</p></div>';
            return;
        }
        container.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="loading-spinner"></div></div>';
        try {
            const { data: students, error } = await supabaseClient.from('profile').select('*');
            if (error) throw error;
            const list = (students || []).filter(s => String(s.role || 'student').toLowerCase() !== 'admin');
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h2 class="card-title">Students (${list.length})</h2></div>
                    <input type="text" class="form-input" placeholder="Search..." oninput="filterTable('studentsTable', this.value)" style="margin-bottom:1rem;">
                    <div class="table-container">
                        <table id="studentsTable">
                            <thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Role</th></tr></thead>
                            <tbody>
                                ${list.length > 0 ? list.map(s => `
                                    <tr>
                                        <td>${esc(s.full_name || 'N/A')}</td>
                                        <td>${esc(s.mobile || s.phone || 'N/A')}</td>
                                        <td>${esc(s.email || 'N/A')}</td>
                                        <td><span class="badge">${esc(s.role || 'student')}</span></td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4" style="text-align:center;">No students</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        } catch (e) {
            container.innerHTML = `<p style="color:var(--red-500);">Error: ${esc(e.message)}</p>`;
        }
    }

    // ==================== SETTINGS ====================
    async function renderSettings(container) {
        if (!isOwner()) {
            container.innerHTML = '<div class="card"><p style="color:var(--red-500);">Owner-only section.</p></div>';
            return;
        }
        container.innerHTML = '<div class="card"><p>Loading settings...</p></div>';
        try {
            const s = await getSettings();
            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Website Settings</h2>
                            <p style="color:var(--gray-500);margin-top:.35rem;">Colors & homepage content — user panel mein reflect honge.</p>
                        </div>
                    </div>
                    <h3 style="margin:1rem 0;">Colors</h3>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">
                        ${['primary_color','secondary_color','accent_color','background_color','text_color'].map(k => `
                            <div class="form-group">
                                <label>${k.replaceAll('_',' ')}</label>
                                <input type="color" class="form-input" id="set_${k}" value="${esc(s[k])}" style="height:50px;padding:0.25rem;">
                            </div>
                        `).join('')}
                    </div>
                    <h3 style="margin:1.5rem 0 1rem;">Homepage Content</h3>
                    <div class="form-group"><label>Hero Title</label><textarea class="form-input" id="set_hero_title" rows="2">${esc(s.hero_title)}</textarea></div>
                    <div class="form-group"><label>Hero Subtitle</label><textarea class="form-input" id="set_hero_subtitle" rows="3">${esc(s.hero_subtitle)}</textarea></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group"><label>Hero Button 1</label><input class="form-input" id="set_hero_button_1" value="${esc(s.hero_button_1)}"></div>
                        <div class="form-group"><label>Hero Button 2</label><input class="form-input" id="set_hero_button_2" value="${esc(s.hero_button_2)}"></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group"><label>Quick Access Heading</label><input class="form-input" id="set_quick_access_title" value="${esc(s.quick_access_title)}"></div>
                        <div class="form-group"><label>Materials Heading</label><input class="form-input" id="set_materials_title" value="${esc(s.materials_title)}"></div>
                        <div class="form-group"><label>Roadmaps Heading</label><input class="form-input" id="set_roadmaps_title" value="${esc(s.roadmaps_title)}"></div>
                        <div class="form-group"><label>News Heading</label><input class="form-input" id="set_news_title" value="${esc(s.news_title)}"></div>
                    </div>
                    <div class="form-group"><label>Announcement</label><input class="form-input" id="set_announcement" value="${esc(s.announcement || '')}"></div>
                    <div class="form-group"><label>Footer Text</label><input class="form-input" id="set_footer_text" value="${esc(s.footer_text || '')}"></div>
                    <button class="btn btn-gold" onclick="saveAllSettings()">💾 Save Website Settings</button>
                </div>
                <div class="card" style="margin-top:1rem;">
                    <div class="card-header"><h2 class="card-title">Admin Account</h2></div>
                    <div class="form-group"><label>Name</label><input class="form-input" value="${esc(currentProfile?.full_name || '')}" readonly></div>
                    <div class="form-group"><label>Email</label><input class="form-input" value="${esc(currentUser?.email || '')}" readonly></div>
                    <div class="form-group"><label>Role</label><input class="form-input" value="${esc(currentProfile?.role || 'admin')}" readonly></div>
                </div>
            `;
        } catch (e) {
            container.innerHTML = `<p style="color:var(--red-500);">Error: ${esc(e.message)}</p>`;
        }
    }

    async function saveAllSettings() {
        const keys = ['primary_color','secondary_color','accent_color','background_color','text_color','hero_title','hero_subtitle','hero_button_1','hero_button_2','quick_access_title','materials_title','roadmaps_title','news_title','announcement','footer_text'];
        const patch = {};
        keys.forEach(k => {
            const el = document.getElementById('set_' + k);
            if (el) patch[k] = el.value;
        });
        try {
            await saveSettings(patch);
            showToast('Website settings saved!', 'success');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    // ==================== INIT ====================
    checkSession();
    </script>
</body>
</html>
