<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADHAKU Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --navy-900: #102a43; --navy-800: #243b53; --navy-700: #334e68;
            --navy-600: #486581; --navy-500: #627d98; --navy-400: #829ab1;
            --navy-300: #9fb3c8; --navy-200: #bcccdc; --navy-100: #d9e2ec;
            --navy-50: #f0f4f8; --gold-500: #f59e0b; --gold-600: #d97706;
            --gold-100: #fef3c7; --white: #ffffff; --gray-50: #f9fafb;
            --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db;
            --gray-500: #6b7280; --gray-700: #374151; --red-500: #ef4444;
            --red-100: #fee2e2; --green-500: #10b981; --green-100: #d1fae5;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1);
            --radius-sm: 0.375rem; --radius-md: 0.5rem;
            --radius-lg: 0.75rem; --radius-xl: 1rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-50); color: var(--navy-900); line-height: 1.6; overflow-x: hidden; }
        h1,h2,h3,h4,h5,h6 { font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; }
        input, select, textarea { font-family: inherit; outline: none; }

        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%); padding: 1rem; }
        .login-card { background: var(--white); border-radius: var(--radius-xl); padding: 2.5rem; max-width: 400px; width: 100%; box-shadow: var(--shadow-xl); }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo h1 { font-size: 2rem; color: var(--navy-900); }
        .login-logo span { color: var(--gold-500); }
        .login-logo p { color: var(--gray-500); font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--navy-700); font-size: 0.9rem; }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--navy-200); border-radius: var(--radius-md); font-size: 1rem; transition: all 0.2s; }
        .form-input:focus { border-color: var(--navy-500); box-shadow: 0 0 0 3px rgba(51,78,104,0.1); }
        .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.9rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--navy-800); color: var(--white); }
        .btn-primary:hover { background: var(--navy-900); }
        .btn-gold { background: var(--gold-500); color: var(--white); }
        .btn-gold:hover { background: var(--gold-600); }
        .btn-danger { background: var(--red-500); color: var(--white); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: var(--white); color: var(--navy-700); border: 1px solid var(--navy-200); }
        .btn-outline:hover { background: var(--navy-50); }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }
        .btn-block { width: 100%; justify-content: center; }

        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--navy-900); color: var(--white); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--navy-700); }
        .sidebar-header h2 { font-size: 1.5rem; color: var(--gold-500); }
        .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--navy-300); transition: all 0.2s; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .sidebar-link:hover { background: var(--navy-800); color: var(--white); }
        .sidebar-link.active { background: var(--navy-800); color: var(--gold-500); border-left: 3px solid var(--gold-500); }
        .sidebar-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--navy-700); }
        .main-content { flex: 1; margin-left: 250px; padding: 2rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; }
        .topbar h1 { font-size: 1.75rem; }
        .hamburger { display: none; background: var(--navy-800); color: var(--white); padding: 0.5rem; border-radius: var(--radius-md); font-size: 1.25rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); }
        .stat-card h3 { font-size: 0.9rem; color: var(--gray-500); margin-bottom: 0.5rem; }
        .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: var(--navy-900); }
        .card { background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .card-title { font-size: 1.25rem; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem; background: var(--navy-50); color: var(--navy-700); font-weight: 600; font-size: 0.875rem; white-space: nowrap; }
        td { padding: 0.75rem; border-bottom: 1px solid var(--gray-200); font-size: 0.875rem; }
        tr:hover { background: var(--gray-50); }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-published { background: var(--green-100); color: var(--green-500); }
        .badge-draft { background: var(--gray-100); color: var(--gray-500); }
        .badge-admin { background: var(--gold-100); color: var(--gold-600); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .modal { background: var(--white); border-radius: var(--radius-xl); padding: 2rem; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; font-size: 1.5rem; color: var(--gray-500); }
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--navy-900); color: var(--white); padding: 1rem 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); z-index: 300; max-width: 90vw; }
        .toast-success { background: var(--green-500); }
        .toast-error { background: var(--red-500); }
        .hidden { display: none !important; }
        .role-banner { padding: .75rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1rem; font-size: .9rem; }
        .role-banner.owner { background: var(--gold-100); color: var(--gold-600); }
        .role-banner.helper { background: var(--navy-50); color: var(--navy-700); border: 1px solid var(--navy-100); }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--navy-200); border-top-color: var(--navy-800); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .hamburger { display: block; }
            .topbar h1 { font-size: 1.25rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .modal { padding: 1.5rem; margin: 0.5rem; }
        }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; }
        .sidebar-overlay.open { display: block; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <h1>PADHAKU<span>.</span></h1>
                <p>Admin Panel</p>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" onkeypress="if(event.key==='Enter') handleLogin()">
                </div>
                <div id="loginError" class="hidden" style="color: var(--red-500); margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button class="btn btn-gold btn-block" onclick="handleLogin()" id="loginBtn">Login</button>
            </div>
            <div id="loginLoading" class="hidden" style="text-align: center; padding: 2rem;">
                <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px;"></div>
                <p style="margin-top: 1rem; color: var(--gray-500);">Authenticating...</p>
            </div>
        </div>
    </div>

    <div id="adminLayout" class="admin-layout hidden">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>PADHAKU Admin</h2>
                <p style="font-size: 0.8rem; color: var(--navy-300);">Content Management</p>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-link active" data-page="dashboard" onclick="switchPage('dashboard')">📊 Dashboard</div>
                <div class="sidebar-link" data-page="materials" onclick="switchPage('materials')">📚 Materials</div>
                <div class="sidebar-link" data-page="skills" onclick="switchPage('skills')">💡 Skill Learning</div>
                <div class="sidebar-link" data-page="about" onclick="switchPage('about')">👤 About Padhaku</div>
                <div class="sidebar-link" data-page="subjects" onclick="switchPage('subjects')">📖 Subjects</div>
                <div class="sidebar-link" data-page="videos" onclick="switchPage('videos')">🎬 Videos</div>
                <div class="sidebar-link" data-page="news" onclick="switchPage('news')">📰 News</div>
                <div class="sidebar-link" data-page="current-affairs" onclick="switchPage('current-affairs')">🌍 Current Affairs</div>
                <div class="sidebar-link" data-page="tests" onclick="switchPage('tests')">✍️ Tests & Quizzes</div>
                <div class="sidebar-link" data-page="roadmaps" onclick="switchPage('roadmaps')">🗺️ Roadmaps</div>
                <div class="sidebar-link" data-page="students" onclick="switchPage('students')">👨‍🎓 Students</div>
                <div class="sidebar-link" data-page="settings" onclick="switchPage('settings')">⚙️ Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="adminName" style="font-weight: 600; color: var(--navy-700);"></span>
                </div>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>

    <div class="toast hidden" id="toast"></div>
    <div id="modalContainer"></div>

    <script>
    const SUPABASE_URL = 'https://ozrvpbziwpkfkejafjnm.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aeCYoS9jRAAqPHIGa6Uz6Q_XY_7l7Lj';
    const SITE_MEDIA_BUCKET = 'site-media';
    let supabaseClient = null;

    function initializeSupabase() {
        try {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('Supabase library failed to load.');
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
                auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
            });
            return true;
        } catch (error) { console.error('Supabase init failed:', error); supabaseClient = null; return false; }
    }
    initializeSupabase();

    let currentPage = 'dashboard';
    let currentUser = null;
    let currentProfile = null;

    const OWNER_ROLE = 'admin';
    const CONTENT_MANAGER_ROLE = 'content_manager';
    const CONTENT_MANAGER_PAGES = new Set(['dashboard', 'materials', 'skills', 'subjects', 'videos', 'news', 'current-affairs', 'tests', 'roadmaps']);
    const OWNER_ONLY_PAGES = new Set(['about', 'students', 'settings']);

    function normalizeRole(value) { return String(value || '').trim().toLowerCase().replace(/[\s-]+/g, '_'); }
    function getCurrentRole() { return normalizeRole(currentProfile?.role); }
    function isOwner() { return getCurrentRole() === OWNER_ROLE; }
    function isContentManager() { return getCurrentRole() === CONTENT_MANAGER_ROLE; }
    function canAccessPage(page) {
        if (isOwner()) return true;
        return isContentManager() && CONTENT_MANAGER_PAGES.has(page);
    }

    const defaultSiteSettings = {
        pw_blue_color: '#1a73e8', pw_yellow_color: '#ffc107', pw_orange_color: '#ff6f00',
        hero_title: 'Learn Today.\nPrepare for Tomorrow.', hero_subtitle: 'Study materials, video lectures, notes, practice questions, current affairs and preparation roadmaps—all in one place.',
        hero_badge: '🏆 India\'s Premium Learning Platform', hero_button_1: 'Get Started →', hero_button_2: 'Explore Courses',
        hero_feature_1: 'Free Study Materials', hero_feature_2: 'Expert-curated Content', hero_feature_3: 'Chapter-wise Tests', hero_feature_4: 'Preparation Roadmaps',
        hero_float_1_icon: '📚', hero_float_1_title: '500+ Materials', hero_float_1_sub: 'Notes & Videos',
        hero_float_2_icon: '🎯', hero_float_2_title: '50+ Exams', hero_float_2_sub: 'JEE, NEET, UPSC',
        hero_float_3_icon: '✅', hero_float_3_title: '100% Free', hero_float_3_sub: 'No hidden charges',
        stat_1_num: '10K+', stat_1_label: 'Active Students', stat_2_num: '500+', stat_2_label: 'Study Materials',
        stat_3_num: '50+', stat_3_label: 'Exams Covered', stat_4_num: '100%', stat_4_label: 'Free Forever',
        explore_title: 'Explore Padhaku', explore_subtitle: 'Everything you need to prepare smarter'
    };

    const defaultStructure = {
        classes: Array.from({length: 12}, (_, i) => ({ id: i + 1, name: `Class ${i+1}`, subjects: [] })),
        streams: [ { name: 'Science', subjects: ['Physics', 'Chemistry', 'Mathematics', 'Biology', 'English'] } ]
    };

    function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast';
        if (type === 'success') toast.classList.add('toast-success');
        else if (type === 'error') toast.classList.add('toast-error');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.add('hidden'), 4000);
    }
    function friendlyError(e) {
        const msg = String(e?.message || e || 'Unknown error');
        if (/row-level security|permission denied/i.test(msg)) return 'Permission denied. Check RLS policies.';
        if (/relation .* does not exist|column .* does not exist/i.test(msg)) return msg + ' — table/column missing.';
        if (/Invalid login credentials/i.test(msg)) return 'Wrong email or password.';
        return msg;
    }

    async function getSettings() {
        const { data, error } = await supabaseClient.from('site_settings').select('settings').eq('id', 1).maybeSingle();
        if (error) throw error;
        return { ...defaultSiteSettings, ...(data?.settings || {}) };
    }
    async function saveSettings(patch) {
        const current = await getSettings();
        const next = { ...current, ...patch };
        const { error } = await supabaseClient.from('site_settings').upsert({ id: 1, settings: next, updated_at: new Date().toISOString() });
        if (error) throw error;
        return next;
    }
    async function getStructure() { const s = await getSettings(); return s.academic_structure || JSON.parse(JSON.stringify(defaultStructure)); }
    async function saveStructure(structure) { await saveSettings({ academic_structure: structure }); }

    async function checkSession() {
        if (!supabaseClient) { showLoginError('Auth service failed. Refresh page.'); return; }
        try {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error) throw error;
            if (session) await verifyAdmin(session.user);
        } catch (e) { console.error(e); }
    }
    async function verifyAdmin(user) {
        if (!supabaseClient) return false;
        try {
            const { data: profile, error } = await supabaseClient.from('profile').select('*').eq('id', user.id).maybeSingle();
            if (error) throw error;
            if (!profile) { await supabaseClient.auth.signOut(); showLoginError('No matching profile record.'); return false; }
            const role = normalizeRole(profile.role);
            if (profile && (role === OWNER_ROLE || role === CONTENT_MANAGER_ROLE)) {
                currentUser = user; currentProfile = profile; showAdminPanel(); return true;
            } else { await supabaseClient.auth.signOut(); showLoginError('Access denied.'); return false; }
        } catch (e) { console.error(e); await supabaseClient.auth.signOut(); showLoginError(friendlyError(e)); return false; }
    }
    async function handleLogin() {
        const errorEl = document.getElementById('loginError');
        errorEl.classList.add('hidden');
        if (!supabaseClient) { showLoginError('Auth not loaded.'); return; }
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showLoginError('Enter email and password'); return; }
        showLoginLoading(true);
        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            if (data.user) await verifyAdmin(data.user);
        } catch (e) { showLoginError(friendlyError(e)); }
        finally { showLoginLoading(false); }
    }
    async function handleLogout() {
        try { await supabaseClient.auth.signOut(); currentUser = null; currentProfile = null; showLoginScreen(); showToast('Logged out'); } catch (e) { showToast('Error logging out', 'error'); }
    }
    function showLoginScreen() {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminLayout').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('loginLoading').classList.add('hidden');
    }
    function showAdminPanel() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminLayout').classList.remove('hidden');
        document.getElementById('adminName').textContent = `${currentProfile?.full_name || currentUser?.email} • ${isOwner() ? 'Owner' : 'Content Manager'}`;
        applyRoleToSidebar(); switchPage('dashboard');
    }
    function showLoginError(message) { const el = document.getElementById('loginError'); el.textContent = message; el.classList.remove('hidden'); }
    function showLoginLoading(show) {
        document.getElementById('loginForm').classList.toggle('hidden', show);
        document.getElementById('loginLoading').classList.toggle('hidden', !show);
        document.getElementById('loginBtn').disabled = show;
    }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    function applyRoleToSidebar() { document.querySelectorAll('.sidebar-link').forEach(link => { link.style.display = canAccessPage(link.dataset.page) ? '' : 'none'; }); }
    
    function switchPage(page) {
        if (!canAccessPage(page)) { showToast('Permission denied.', 'error'); return; }
        currentPage = page; applyRoleToSidebar();
        document.querySelectorAll('.sidebar-link').forEach(link => { link.classList.remove('active'); if (link.dataset.page === page) link.classList.add('active'); });
        const titles = { 'dashboard': 'Dashboard', 'materials': 'Materials', 'skills': 'Skill Learning', 'about': 'About', 'subjects': 'Subjects', 'videos': 'Videos', 'news': 'News', 'current-affairs': 'Current Affairs', 'tests': 'Tests', 'roadmaps': 'Roadmaps', 'students': 'Students', 'settings': 'Settings' };
        document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
        if (window.innerWidth <= 768) toggleSidebar();
        const content = document.getElementById('pageContent');
        switch(page) {
            case 'dashboard': renderDashboard(content); break;
            case 'materials': renderMaterials(content); break;
            case 'skills': renderSkillsAdmin(content); break;
            case 'about': renderAboutPadhaku(content); break;
            case 'subjects': renderSubjects(content); break;
            case 'videos': renderVideos(content); break;
            case 'news': renderNews(content); break;
            case 'current-affairs': renderCurrentAffairs(content); break;
            case 'tests': renderTests(content); break;
            case 'roadmaps': renderRoadmaps(content); break;
            case 'students': renderStudents(content); break;
            case 'settings': renderSettings(content); break;
        }
    }

    // ==================== DASHBOARD ====================
    async function renderDashboard(container) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="loading-spinner"></div></div>';
        try {
            const profileCountPromise = isOwner() ? supabaseClient.from('profile').select('*', { count: 'exact', head: true }) : Promise.resolve({ count: null });
            const [s, m, sk, v, n, ca, t] = await Promise.all([
                profileCountPromise,
                supabaseClient.from('materials').select('*', { count: 'exact', head: true }).is('class', null).is('subject', null),
                supabaseClient.from('skill_resources').select('*', { count: 'exact', head: true }),
                supabaseClient.from('videos').select('*', { count: 'exact', head: true }),
                supabaseClient.from('news').select('*', { count: 'exact', head: true }),
                supabaseClient.from('current_affairs').select('*', { count: 'exact', head: true }),
                supabaseClient.from('tests').select('*', { count: 'exact', head: true })
            ]);
            container.innerHTML = `
                <div class="role-banner ${isOwner() ? 'owner' : 'helper'}"><strong>${isOwner() ? 'Owner' : 'Content Manager'}</strong></div>
                <div class="stats-grid">
                    ${isOwner() ? `<div class="stat-card"><h3>Total Users</h3><div class="stat-value">${s.count || 0}</div></div>` : ''}
                    <div class="stat-card"><h3>Materials</h3><div class="stat-value">${m.count || 0}</div></div>
                    <div class="stat-card"><h3>Skill Resources</h3><div class="stat-value">${sk.count || 0}</div></div>
                    <div class="stat-card"><h3>Videos</h3><div class="stat-value">${v.count || 0}</div></div>
                    <div class="stat-card"><h3>News</h3><div class="stat-value">${n.count || 0}</div></div>
                </div>
            `;
        } catch (e) { container.innerHTML = `<p style="color:red;">Error: ${esc(friendlyError(e))}</p>`; }
    }

    // ==================== MATERIALS ====================
    async function renderMaterials(container) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="loading-spinner"></div></div>';
        try {
            const { data: allMaterials, error } = await supabaseClient.from('materials').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            const materials = (allMaterials || []).filter(m => !String(m.class || '').trim() && !String(m.subject || '').trim() && !String(m.chapter || '').trim());
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h2 class="card-title">Additional Materials (${materials?.length || 0})</h2><button class="btn btn-gold" onclick="showMaterialForm()">+ Add Material</button></div>
                    <div class="table-container"><table><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>
                        ${materials?.length > 0 ? materials.map(m => `<tr><td>${esc(m.title)}</td><td><span class="badge">${esc(m.type)}</span></td><td><span class="badge ${m.published ? 'badge-published' : 'badge-draft'}">${m.published ? 'Published' : 'Draft'}</span></td><td><button class="btn btn-primary btn-sm" onclick="showMaterialForm('${m.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteMaterial('${m.id}')">Delete</button></td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;">No materials</td></tr>'}
                    </tbody></table></div>
                </div>
            `;
        } catch (e) { container.innerHTML = `<p style="color:red;">Error: ${esc(friendlyError(e))}</p>`; }
    }

    function showMaterialForm(id = null) {
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal">
                <h2 style="margin-bottom:1.5rem;">${id ? 'Edit' : 'Add'} Material</h2>
                <div id="materialFormContent"><div style="text-align:center;padding:2rem;"><div class="loading-spinner"></div></div></div>
                <div style="display:flex;gap:0.5rem;margin-top:1.5rem;"><button class="btn btn-primary" onclick="saveMaterial('${id || ''}')">Save</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>
            </div>`;
        document.getElementById('modalContainer').appendChild(modal);
        if (id) loadMaterialForEdit(id); else document.getElementById('materialFormContent').innerHTML = materialFormHTML();
    }
    async function loadMaterialForEdit(id) {
        try { const { data, error } = await supabaseClient.from('materials').select('*').eq('id', id).single(); if (error) throw error; document.getElementById('materialFormContent').innerHTML = materialFormHTML(data); } catch (e) { showToast('Error: ' + friendlyError(e), 'error'); }
    }
    function materialFormHTML(m = null) {
        return `
            <div class="form-group"><label>Title *</label><input type="text" class="form-input" id="matTitle" value="${esc(m?.title)}"></div>
            <div class="form-group"><label>Description</label><textarea class="form-input" id="matDescription" rows="3">${esc(m?.description)}</textarea></div>
            <div class="form-group"><label>Type</label><select class="form-input" id="matType">${['Notes','PDF','Video','PYQ','Test'].map(t => `<option value="${t}" ${m?.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
            <div class="form-group"><label>URL *</label><input type="url" class="form-input" id="matResourceUrl" value="${esc(m?.resource_url)}"></div>
            <div class="form-group"><label style="display:flex;align-items:center;gap:0.5rem;"><input type="checkbox" id="matPublished" ${m?.published !== false ? 'checked' : ''}> Published</label></div>
        `;
    }
    async function saveMaterial(id) {
        const payload = { title: document.getElementById('matTitle').value.trim(), description: document.getElementById('matDescription').value.trim(), type: document.getElementById('matType').value, resource_url: document.getElementById('matResourceUrl').value.trim(), published: document.getElementById('matPublished').checked };
        if (!payload.title) { showToast('Title required', 'error'); return; }
        try {
            let result;
            if (id) result = await supabaseClient.from('materials').update(payload).eq('id', id);
            else result = await supabaseClient.from('materials').insert(payload);
            if (result.error) throw result.error;
            document.querySelector('.modal-overlay')?.remove(); showToast('Saved!', 'success'); switchPage('materials');
        } catch (e) { showToast('Error: ' + friendlyError(e), 'error'); }
    }
    async function deleteMaterial(id) {
        if (!confirm('Delete this material?')) return;
        try { const { error } = await supabaseClient.from('materials').delete().eq('id', id); if (error) throw error; showToast('Deleted', 'success'); switchPage('materials'); } catch (e) { showToast('Error: ' + friendlyError(e), 'error'); }
    }

    // ==================== SKILL LEARNING ADMIN ====================
    async function renderSkillsAdmin(container) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="loading-spinner"></div></div>';
        try {
            const { data: cats, error: catErr } = await supabaseClient.from('skill_categories').select('*').order('created_at', { ascending: false });
            const { data: res, error: resErr } = await supabaseClient.from('skill_resources').select('*, skill_categories(name)').order('created_at', { ascending: false });
            if (catErr) throw catErr;
            if (resErr) throw resErr;

            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h2 class="card-title">Skill Categories (${cats?.length || 0})</h2><button class="btn btn-gold" onclick="showSkillCatForm()">+ Add Category</button></div>
                    <table><thead><tr><th>Name</th><th>Actions</th></tr></thead><tbody>
                        ${cats?.map(c => `<tr><td>${esc(c.name)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteSkillCat('${c.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="2">No categories</td></tr>'}
                    </tbody></table>
                </div>
                <div class="card">
                    <div class="card-header"><h2 class="card-title">Skill Resources (${res?.length || 0})</h2><button class="btn btn-gold" onclick="showSkillResForm()">+ Add Resource</button></div>
                    <table><thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Actions</th></tr></thead><tbody>
                        ${res?.map(r => `<tr><td>${esc(r.title)}</td><td>${esc(r.skill_categories?.name || '-')}</td><td>${esc(r.type)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteSkillRes('${r.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="4">No resources</td></tr>'}
                    </tbody></table>
                </div>
            `;
        } catch (e) { container.innerHTML = `<p style="color:red;">Error: ${esc(e.message)}</p>`; }
    }
    window.showSkillCatForm = function() {
        const name = prompt('Enter Category Name (e.g., Web Development):'); if (!name) return;
        supabaseClient.from('skill_categories').insert({ name }).then(({error}) => { if (error) showToast(error.message, 'error'); else { showToast('Added'); renderSkillsAdmin(document.getElementById('pageContent')); } });
    };
    window.showSkillResForm = async function() {
        const { data: cats } = await supabaseClient.from('skill_categories').select('*');
        if (!cats || cats.length === 0) { showToast('Pehle category banao', 'error'); return; }
        const title = prompt('Enter Resource Title:'); if (!title) return;
        const catName = prompt('Enter Category Name (exact match):'); if (!catName) return;
        const cat = cats.find(c => c.name.toLowerCase() === catName.toLowerCase()); if (!cat) { showToast('Category not found', 'error'); return; }
        const url = prompt('Enter Video/Resource URL:'); if (!url) return;
        const type = prompt('Type (Video/Notes/PDF):', 'Video') || 'Video';
        supabaseClient.from('skill_resources').insert({ title, category_id: cat.id, resource_url: url, type }).then(({error}) => { if (error) showToast(error.message, 'error'); else { showToast('Added'); renderSkillsAdmin(document.getElementById('pageContent')); } });
    };
    window.deleteSkillCat = async function(id) { if (!confirm('Delete category?')) return; await supabaseClient.from('skill_categories').delete().eq('id', id); renderSkillsAdmin(document.getElementById('pageContent')); };
    window.deleteSkillRes = async function(id) { if (!confirm('Delete resource?')) return; await supabaseClient.from('skill_resources').delete().eq('id', id); renderSkillsAdmin(document.getElementById('pageContent')); };
