<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADHAKU Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --navy-900: #102a43;
            --navy-800: #243b53;
            --navy-700: #334e68;
            --navy-600: #486581;
            --navy-500: #627d98;
            --navy-400: #829ab1;
            --navy-300: #9fb3c8;
            --navy-200: #bcccdc;
            --navy-100: #d9e2ec;
            --navy-50: #f0f4f8;
            --gold-500: #f59e0b;
            --gold-600: #d97706;
            --gold-100: #fef3c7;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --red-500: #ef4444;
            --red-100: #fee2e2;
            --green-500: #10b981;
            --green-100: #d1fae5;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--gray-50);
            color: var(--navy-900);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
        }

        input, select, textarea {
            font-family: inherit;
            outline: none;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
            padding: 1rem;
        }

        .login-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-xl);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo h1 {
            font-size: 2rem;
            color: var(--navy-900);
        }

        .login-logo span {
            color: var(--gold-500);
        }

        .login-logo p {
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--navy-700);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--navy-200);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--navy-500);
            box-shadow: 0 0 0 3px rgba(51,78,104,0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--navy-800);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--navy-900);
        }

        .btn-gold {
            background: var(--gold-500);
            color: var(--white);
        }

        .btn-gold:hover {
            background: var(--gold-600);
        }

        .btn-danger {
            background: var(--red-500);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: var(--white);
            color: var(--navy-700);
            border: 1px solid var(--navy-200);
        }

        .btn-outline:hover {
            background: var(--navy-50);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Admin Layout */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--navy-900);
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--navy-700);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            color: var(--gold-500);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--navy-300);
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .sidebar-link:hover {
            background: var(--navy-800);
            color: var(--white);
        }

        .sidebar-link.active {
            background: var(--navy-800);
            color: var(--gold-500);
            border-left: 3px solid var(--gold-500);
        }

        .sidebar-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--navy-700);
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 2rem;
        }

        /* Top Bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .topbar h1 {
            font-size: 1.75rem;
        }

        .hamburger {
            display: none;
            background: var(--navy-800);
            color: var(--white);
            padding: 0.5rem;
            border-radius: var(--radius-md);
            font-size: 1.25rem;
        }

        /* Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--gray-500);
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--navy-900);
        }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            background: var(--navy-50);
            color: var(--navy-700);
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.875rem;
        }

        tr:hover {
            background: var(--gray-50);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-published {
            background: var(--green-100);
            color: var(--green-500);
        }

        .badge-draft {
            background: var(--gray-100);
            color: var(--gray-500);
        }

        .badge-admin {
            background: var(--gold-100);
            color: var(--gold-600);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--navy-900);
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            z-index: 300;
            animation: slideUp 0.3s;
        }

        .toast-success {
            background: var(--green-500);
        }

        .toast-error {
            background: var(--red-500);
        }

        .hidden {
            display: none !important;
        }

        /* Loading */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--navy-200);
            border-top-color: var(--navy-800);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
            
            .hamburger {
                display: block;
            }
            
            .topbar h1 {
                font-size: 1.25rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .modal {
                padding: 1.5rem;
                margin: 0.5rem;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
        }

        .sidebar-overlay.open {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <h1>PADHAKU<span>.</span></h1>
                <p>Admin Panel</p>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password">
                </div>
                <div id="loginError" class="hidden" style="color: var(--red-500); margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button class="btn btn-gold btn-block" onclick="handleLogin()" id="loginBtn">
                    Login
                </button>
            </div>
            <div id="loginLoading" class="hidden" style="text-align: center; padding: 2rem;">
                <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px;"></div>
                <p style="margin-top: 1rem; color: var(--gray-500);">Authenticating...</p>
            </div>
        </div>
    </div>

    <!-- Admin Layout -->
    <div id="adminLayout" class="admin-layout hidden">
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>PADHAKU Admin</h2>
                <p style="font-size: 0.8rem; color: var(--navy-300);">Content Management</p>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-link active" data-page="dashboard" onclick="switchPage('dashboard')">📊 Dashboard</div>
                <div class="sidebar-link" data-page="materials" onclick="switchPage('materials')">📚 Study Materials</div>
                <div class="sidebar-link" data-page="classes" onclick="switchPage('classes')">🏫 Classes</div>
                <div class="sidebar-link" data-page="subjects" onclick="switchPage('subjects')">📖 Subjects</div>
                <div class="sidebar-link" data-page="videos" onclick="switchPage('videos')">🎬 Videos</div>
                <div class="sidebar-link" data-page="news" onclick="switchPage('news')">📰 News</div>
                <div class="sidebar-link" data-page="current-affairs" onclick="switchPage('current-affairs')">🌍 Current Affairs</div>
                <div class="sidebar-link" data-page="tests" onclick="switchPage('tests')">✍️ Tests & Quizzes</div>
                <div class="sidebar-link" data-page="roadmaps" onclick="switchPage('roadmaps')">🗺️ Roadmaps</div>
                <div class="sidebar-link" data-page="students" onclick="switchPage('students')">👨🎓 Students</div>
                <div class="sidebar-link" data-page="settings" onclick="switchPage('settings')">⚙️ Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="adminName" style="font-weight: 600; color: var(--navy-700);"></span>
                </div>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script>
        // ==================== SUPABASE CONFIGURATION ====================
        const SUPABASE_URL = 'https://ozrvpbziwpfkfejafjnm.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aeCYoS9jRAAqPHIG6aUz6Q_XY_7l7Lj';

        // Keep the client variable available to every existing Admin Panel function.
        // Do not let a CDN/init error stop the rest of this script from defining handleLogin().
        let supabaseClient = null;

        function initializeSupabase() {
            try {
                if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                    throw new Error('Supabase library failed to load.');
                }

                supabaseClient = window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_PUBLISHABLE_KEY,
                    {
                        auth: {
                            autoRefreshToken: true,
                            persistSession: true,
                            detectSessionInUrl: true
                        }
                    }
                );

                return true;
            } catch (error) {
                console.error('Supabase initialization failed:', error);
                supabaseClient = null;
                return false;
            }
        }

        initializeSupabase();

        // ==================== STATE ====================
        let currentPage = 'dashboard';
        let currentUser = null;
        let currentProfile = null;

        // ==================== AUTH FUNCTIONS ====================
        
        async function checkSession() {
            if (!supabaseClient) {
                showLoginError('Authentication service could not be loaded. Please refresh the page.');
                return;
            }

            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (session) {
                    await verifyAdmin(session.user);
                }
            } catch (error) {
                console.error('Session check failed:', error);
                showLoginError(error.message || 'Unable to check your session. Please refresh the page.');
            }
        }

        async function verifyAdmin(user) {
            if (!supabaseClient) {
                showLoginError('Authentication service is not available. Please refresh the page.');
                return false;
            }

            try {
                const { data: profile, error } = await supabase
                    .from('profile') // FIXED: changed 'profile' to 'profile'
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (error) throw error;

                if (profile && profile.role === 'admin') {
                    currentUser = user;
                    currentProfile = profile;
                    showAdminPanel();
                    return true;
                } else {
                    await supabaseClient.auth.signOut();
                    showLoginError('Access denied. Admin account required.');
                    return false;
                }
            } catch (error) {
                console.error('Error verifying admin:', error);
                await supabaseClient.auth.signOut();
                showLoginError(error.message || 'Unable to verify admin account.');
                return false;
            }
        }

        async function handleLogin() {
            const errorEl = document.getElementById('loginError');
            errorEl.classList.add('hidden');
            errorEl.textContent = '';

            if (!supabaseClient) {
                showLoginError('Authentication service could not be loaded. Please refresh the page.');
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showLoginError('Please enter email and password');
                return;
            }

            showLoginLoading(true);

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    await verifyAdmin(data.user);
                }
            } catch (error) {
                showLoginError(error.message || 'Login failed');
            } finally {
                showLoginLoading(false);
            }
        }

        async function handleLogout() {
            try {
                await supabaseClient.auth.signOut();
                currentUser = null;
                currentProfile = null;
                showLoginScreen();
                showToast('Logged out successfully', 'success');
            } catch (error) {
                showToast('Error logging out', 'error');
            }
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminLayout').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginLoading').classList.add('hidden');
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminLayout').classList.remove('hidden');
            document.getElementById('adminName').textContent = currentProfile?.full_name || currentUser?.email || 'Admin';
            switchPage('dashboard');
        }

        function showLoginError(message) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showLoginLoading(show) {
            document.getElementById('loginForm').classList.toggle('hidden', show);
            document.getElementById('loginLoading').classList.toggle('hidden', !show);
            document.getElementById('loginBtn').disabled = show;
        }

        // ==================== SIDEBAR ====================
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        function switchPage(page) {
            currentPage = page;
            
            // Update sidebar
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) {
                    link.classList.add('active');
                }
            });
            
            // Update title
            const titles = {
                'dashboard': 'Dashboard',
                'materials': 'Study Materials',
                'classes': 'Classes',
                'subjects': 'Subjects',
                'videos': 'Videos',
                'news': 'News',
                'current-affairs': 'Current Affairs',
                'tests': 'Tests & Quizzes',
                'roadmaps': 'Roadmaps',
                'students': 'Students',
                'settings': 'Settings'
            };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
            
            // Render page
            const content = document.getElementById('pageContent');
            switch(page) {
                case 'dashboard':
                    renderDashboard(content);
                    break;
                case 'materials':
                    renderMaterials(content);
                    break;
                case 'classes':
                    renderClasses(content);
                    break;
                case 'subjects':
                    renderSubjects(content);
                    break;
                case 'videos':
                    renderVideos(content);
                    break;
                case 'news':
                    renderNews(content);
                    break;
                case 'current-affairs':
                    renderCurrentAffairs(content);
                    break;
                case 'tests':
                    renderTests(content);
                    break;
                case 'roadmaps':
                    renderRoadmaps(content);
                    break;
                case 'students':
                    renderStudents(content);
                    break;
                case 'settings':
                    renderSettings(content);
                    break;
            }
        }

        // ==================== DASHBOARD ====================
        
        async function renderDashboard(container) {
            container.innerHTML = '<div style="text-align: center; padding: 3rem;"><div class="loading-spinner"></div></div>';
            
            try {
                const [studentsResult, materialsResult, videosResult, newsResult, caResult, testsResult] = await Promise.all([
                    supabaseClient.from('profile').select('*', { count: 'exact', head: true }), // FIXED: 'profile' to 'profile', added head: true
                    supabaseClient.from('materials').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('videos').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('news').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('current_affairs').select('*', { count: 'exact', head: true }),
                    supabaseClient.from('tests').select('*', { count: 'exact', head: true })
                ]);

                const totalStudents = studentsResult.count || 0;
                const totalMaterials = materialsResult.count || 0;
                const totalVideos = videosResult.count || 0;
                const totalNews = newsResult.count || 0;
                const totalCA = caResult.count || 0;
                const totalTests = testsResult.count || 0;

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total Students</h3>
                            <div class="stat-value">${totalStudents}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Study Materials</h3>
                            <div class="stat-value">${totalMaterials}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Videos</h3>
                            <div class="stat-value">${totalVideos}</div>
                        </div>
                        <div class="stat-card">
                            <h3>News</h3>
                            <div class="stat-value">${totalNews}</div>
                        </div>
                        <div class="stat-card">

        async function saveMaterial(materialId) {
            const materialData = {
                title: document.getElementById('matTitle').value,
                description: document.getElementById('matDescription').value,
                class: document.getElementById('matClass').value,
                subject: document.getElementById('matSubject').value,
                chapter: document.getElementById('matChapter').value,
                type: document.getElementById('matType').value,
                thumbnail_url: document.getElementById('matThumbnail').value,
                resource_url: document.getElementById('matResourceUrl').value,
                youtube_url: document.getElementById('matYoutubeUrl').value,
                published: document.getElementById('matPublished').checked
            };

            if (!materialData.title || !materialData.type) {
                showToast('Please fill in required fields', 'error');
                return;
            }

            try {
                let result;
                if (materialId) {
                    result = await supabase
                        .from('materials')
                        .update(materialData)
                        .eq('id', materialId);
                } else {
                    result = await supabase
                        .from('materials')
                        .insert(materialData);
                }

                if (result.error) throw result.error;
                
                document.querySelector('.modal-overlay').remove();
                showToast('Material saved successfully', 'success');
                switchPage('materials');
            } catch (error) {
                console.error('Error saving material:', error);
                showToast('Error saving material: ' + error.message, 'error');
            }
        }

        function filterTable(tableId, query) {
            const table = document.getElementById(tableId);
            const rows = table.getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].textContent.toLowerCase();
                rows[i].style.display = rowText.includes(query.toLowerCase()) ? '' : 'none';
            }
        }

        function filterMaterialsByType(type) {
            const table = document.getElementById('materialsTable');
            const rows = table.getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                const typeCell = rows[i].getElementsByTagName('td')[3];
                if (typeCell) {
                    const typeText = typeCell.textContent;
                    rows[i].style.display = (type === 'all' || typeText.includes(type)) ? '' : 'none';
                }
            }
        }

        async function saveTest(testId) {
            const title = document.getElementById('testTitle').value;
            if (!title) {
                showToast('Please enter test title', 'error');
                return;
            }
            
            const testData = {
                title: title,
                class: document.getElementById('testClass').value,
                subject: document.getElementById('testSubject').value,
                duration: parseInt(document.getElementById('testDuration').value) || 30,
                description: document.getElementById('testDescription').value,
                published: document.getElementById('testPublished').checked
            };
            
            try {
                let testResult;
                if (testId) {
                    testResult = await supabaseClient.from('tests').update(testData).eq('id', testId);
                } else {
                    testResult = await supabaseClient.from('tests').insert(testData).select();
                }
                
                if (testResult.error) throw testResult.error;
                
                const savedTestId = testId || testResult.data[0].id;
                
                // Delete existing questions if editing
                if (testId) {
                    await supabaseClient.from('test_questions').delete().eq('test_id', testId);
                }
                
                // Save questions
                const questionDivs = document.querySelectorAll('.test-question');
                const questions = [];
                
                questionDivs.forEach((div, index) => {
                    const questionText = div.querySelector('.question-text').value;
                    if (questionText) {
                        questions.push({
                            test_id: savedTestId,
                            question: questionText,
                            option_a: div.querySelector('.option-a').value,
                            option_b: div.querySelector('.option-b').value,
                            option_c: div.querySelector('.option-c').value,
                            option_d: div.querySelector('.option-d').value,
                            correct_answer: div.querySelector('.correct-answer').value,
                            explanation: div.querySelector('.explanation').value,
                            question_order: index
                        });
                    }
                });
                
                if (questions.length > 0) {
                    const { error: qError } = await supabaseClient.from('test_questions').insert(questions);
                    if (qError) throw qError;
                }
                
                document.querySelector('.modal-overlay').remove();
                showToast('Test saved successfully', 'success');
                switchPage('tests');
            } catch (error) {
                console.error('Error saving test:', error);
                showToast('Error saving test: ' + error.message, 'error');
            }
        }

            stepDiv.style.cssText = 'border: 1px solid var(--navy-200); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1rem;';
            stepDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <strong>Step ${stepsList.children.length + 1}</strong>
                    <button class="btn btn-danger btn-sm" onclick="this.closest('div').remove()">Remove</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Month</label>
                        <input type="text" class="form-input step-month" value="${step?.month || ''}" placeholder="e.g., Month 1-3">
                    </div>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" class="form-input step-title" value="${step?.title || ''}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subjects (comma-separated)</label>
                    <input type="text" class="form-input step-subjects" value="${step?.subjects ? step.subjects.join(', ') : ''}">
                </div>
                <div class="form-group">
                    <label>Topics (comma-separated)</label>
                    <input type="text" class="form-input step-topics" value="${step?.topics ? step.topics.join(', ') : ''}">
                </div>
            `;
            stepsList.appendChild(stepDiv);
        }

        async function saveRoadmap(roadmapId) {
            const examName = document.getElementById('rmExamName').value;
            if (!examName) {
                showToast('Please enter exam name', 'error');
                return;
            }
            
            const roadmapData = {
                exam_name: examName,
                duration: document.getElementById('rmDuration').value,
                difficulty: document.getElementById('rmDifficulty').value,
                description: document.getElementById('rmDescription').value,
                published: document.getElementById('rmPublished').checked
            };
            
            try {
                let roadmapResult;
                if (roadmapId) {
                    roadmapResult = await supabaseClient.from('roadmaps').update(roadmapData).eq('id', roadmapId);
                } else {
                    roadmapResult = await supabaseClient.from('roadmaps').insert(roadmapData).select();
                }
                
                if (roadmapResult.error) throw roadmapResult.error;
                
                const savedRoadmapId = roadmapId || roadmapResult.data[0].id;
                
                if (roadmapId) {
                    await supabaseClient.from('roadmap_steps').delete().eq('roadmap_id', roadmapId);
                }
                
                const stepDivs = document.querySelectorAll('#stepsList > div');
                const steps = [];
                
                stepDivs.forEach((div, index) => {
                    const month = div.querySelector('.step-month').value;
                    const title = div.querySelector('.step-title').value;
                    if (month || title) {
                        steps.push({
                            roadmap_id: savedRoadmapId,
                            month: month,
                            title: title,
                            subjects: div.querySelector('.step-subjects').value.split(',').map(s => s.trim()).filter(s => s),
                            topics: div.querySelector('.step-topics').value.split(',').map(s => s.trim()).filter(s => s),
                            step_order: index
                        });
                    }
                });
                
                if (steps.length > 0) {
                    const { error: sError } = await supabaseClient.from('roadmap_steps').insert(steps);
                    if (sError) throw sError;
                }
                
                document.querySelector('.modal-overlay').remove();
                showToast('Roadmap saved successfully', 'success');
                switchPage('roadmaps');
            } catch (error) {
                console.error('Error saving roadmap:', error);
                showToast('Error saving roadmap: ' + error.message, 'error');
            }
        }

        async function deleteRoadmap(roadmapId) {
            if (!confirm('Are you sure you want to delete this roadmap?')) return;
            
            try {
                const { error } = await supabaseClient.from('roadmaps').delete().eq('id', roadmapId);
                if (error) throw error;
                showToast('Roadmap deleted successfully', 'success');
                switchPage('roadmaps');
            } catch (error) {
                console.error('Error deleting roadmap:', error);
                showToast('Error deleting roadmap', 'error');
            }
        }

        // ==================== STUDENTS ====================
        
        async function renderStudents(container) {
            container.innerHTML = '<div style="text-align: center; padding: 3rem;"><div class="loading-spinner"></div></div>';
            
            try {
                const { data: students, error } = await supabase
                    .from('profile') // FIXED: changed 'profile' to 'profile'
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Students (${students?.length || 0})</h2>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <input type="text" class="form-input" placeholder="Search students..." oninput="filterTable('studentsTable', this.value)">
                        </div>
                        <div class="table-container">
                            <table id="studentsTable">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Mobile</th>
                                        <th>Role</th>
                                        <th>Registration Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${students?.length > 0 ? students.map(s => `
                                        <tr>
                                            <td>${s.full_name || 'N/A'}</td>
                                            <td>${s.mobile || 'N/A'}</td>
                                            <td><span class="badge ${s.role === 'admin' ? 'badge-admin' : ''}">${s.role || 'student'}</span></td>
                                            <td>${s.created_at ? new Date(s.created_at).toLocaleDateString() : 'N/A'}</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="4" style="text-align: center;">No students found</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading students:', error);
                container.innerHTML = '<p style="color: var(--red-500);">Error loading students.</p>';
            }
        }

        // ==================== SETTINGS ====================
        
        function renderSettings(container) {
            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Settings</h2>
                    </div>
                    <div class="form-group">
                        <label>Admin Name</label>
                        <input type="text" class="form-input" value="${currentProfile?.full_name || ''}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" class="form-input" value="${currentUser?.email || ''}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <input type="text" class="form-input" value="${currentProfile?.role || 'admin'}" readonly>
                    </div>
                    <div style="margin-top: 2rem; padding: 1rem; background: var(--gray-50); border-radius: var(--radius-lg);">
                        <h3 style="color: var(--navy-700); margin-bottom: 0.5rem;">About</h3>
                        <p style="color: var(--gray-500); font-size: 0.9rem;">PADHAKU Admin Panel v1.0</p>
                        <p style="color: var(--gray-500); font-size: 0.9rem;">Connected to Supabase</p>
                    </div>
                </div>
            `;
        }

        // ==================== TOAST ====================
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'success') {
                toast.classList.add('toast-success');
            } else if (type === 'error') {
                toast.classList.add('toast-error');
            }
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // ==================== INITIALIZATION ====================
        
        checkSession();
    </script>
</body>
</html>
